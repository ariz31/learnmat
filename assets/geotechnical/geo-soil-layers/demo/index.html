<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layered soil effective stress</title><style>body{font:15px system-ui,sans-serif;margin:0;padding:24px;background:#eef5f8;color:#10212b}main{max-width:980px;margin:auto;display:grid;gap:16px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;background:#fff;padding:14px;border-radius:12px}label{display:grid;gap:4px}</style></head><body><main><h1>Layered soil profile</h1><p>One-dimensional vertical geostatic stress model with hydrostatic pore pressure below the stated water table. Capillarity, surcharge, lateral stresses, and consolidation are outside this asset.</p><form id="controls" class="controls"><label>Water table depth (m)<input name="waterTableDepth" type="number" step=".1" value="2.5"></label><label>Query depth (m)<input name="queryDepth" type="number" step=".1" value="5.5"></label><label>Layer 1 thickness (m)<input name="layer1Thickness" type="number" step=".1" value="2"></label><label>Layer 2 thickness (m)<input name="layer2Thickness" type="number" step=".1" value="3"></label><label>Layer 3 thickness (m)<input name="layer3Thickness" type="number" step=".1" value="4"></label></form><div id="asset"></div><p id="status" role="status"></p></main><script type="module">import{createAsset}from'../src/asset.mjs';const a=createAsset({container:document.querySelector('#asset'),seed:1,reducedMotion:true});const f=document.querySelector('#controls'),s=document.querySelector('#status');f.addEventListener('input',()=>{try{a.setParameters({waterTableDepth:+f.waterTableDepth.value,queryDepth:+f.queryDepth.value,layer1Thickness:+f.layer1Thickness.value,layer2Thickness:+f.layer2Thickness.value,layer3Thickness:+f.layer3Thickness.value});s.textContent='';}catch(e){s.textContent=e.message;}});</script></body></html>
