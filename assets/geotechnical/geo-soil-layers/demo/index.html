.background=new THREE.Color(0x0b1114);scene.fog=new THREE.Fog(0x0b1114,14,30);const camera=new THREE.PerspectiveCamera(40,1,.05,90);camera.position.set(8,5.5,8);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd7eee7,0x231b14,1.45));const sun=new THREE.DirectionalLight(0xfff6df,3);sun.position.set(7,10,5);sun.castShadow=true;scene.add(sun);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,-1.4,0);controls.minDistance=5;controls.maxDistance=18;let cameraSettling=true;controls.addEventListener('start',()=>cameraSettling=false);const assetSceneChildren=new Set(scene.children);const asset=createAsset({container:host,three:THREE,scene,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});const assetRoots=()=>scene.children.filter(child=>!assetSceneChildren.has(child));const STEPS=[['Read the strata','Layer thicknesses control the 3D vertical proportions. Natural and saturated unit weights remain numerical material inputs.'],['Locate the water table','The translucent blue plane marks zWT. A pulsing query ring marks the selected depth.'],['Integrate total stress','σv sums γ·Δz layer by layer, splitting a layer if the water table crosses it.'],['Subtract pore pressure','Hydrostatic u = γw(z−zWT) below the table; σ′v = σv − u. Vector lengths are normalized only for display.']];const CAM=[[8,5.5,8],[6,1.8,9],[-7,3.5,7],[7,2,-7]],TGT=[[0,-1.4,0],[0,-1.5,0],[1,-2,0],[0,-2,0]];let stepPose=null,step=0,playing=true,t=0,start=performance.now(),last=asset.snapshot();document.querySelector('#steps').innerHTML=STEPS.map((s,i)=>'<button class="step" data-i="'+i+'">'+(i+1)+' '+s[0]+'</button>').join('');function hud(){const s=last.state;document.querySelector('#hud').innerHTML=[['σv',s.totalStress.toFixed(2)+' kPa'],['u',s.porePressure.toFixed(2)+' kPa'],['σ′v',s.effectiveStress.toFixed(2)+' kPa'],['WT depth',last.parameters.waterTableDepth.toFixed(2)+' m'],['Query z',last.parameters.queryDepth.toFixed(2)+' m'],['Profile',s.totalDepth.toFixed(2)+' m']].map(x=>'<div class="m"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}function setStep(i){cameraSettling=true;step=(i+4)%4;const direction=new THREE.Vector3(...CAM[step]).sub(new THREE.Vector3(...TGT[step]));stepPose=getFitPose({THREE,camera,roots:assetRoots(),direction,padding:1.32});extendSceneFog(scene,stepPose);if(stepPose&&matchMedia('(prefers-reduced-motion: reduce)').matches){camera.position.copy(stepPose.position);controls.target.copy(stepPose.target);cameraSettling=false;controls.update()}document.querySelectorAll('.step').forEach((b,j)=>b.classList.toggle('active',j===step));document.querySelector('#lesson').innerHTML='<div class="k">Step '+(step+1)+' / 4</div><h2>'+STEPS[step][0]+'</h2><p>'+STEPS[step][1]+'</p><details><summary>Assumptions</summary><p>1-D geostatic stress, hydrostatic pore pressure, no capillarity/surcharge/excess pore pressure.</p></details>';hud()}document.querySelector('#steps').onclick=e=>{const b=e.target.closest('.step');if(b)setStep(+b.dataset.i)};document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play';if(playing)start=performance.now()-t*1000};document.querySelector('#overview').onclick=()=>{cameraSettling=false;fitSceneToView({THREE,scene,camera,controls,roots:assetRoots(),direction:camera.position.clone().sub(controls.target),padding:1.32})};document.querySelector('#reset').onclick=()=>{t=0;start=performance.now();last=asset.reset();setStep(0)};document.querySelector('#focus').onclick=async()=>{stage.classList.toggle('focus');if(stage.classList.contains('focus')){try{await stage.requestFullscreen?.()}catch{}}else if(document.fullscreenElement)await document.exitFullscreen?.()};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)stage.classList.remove('focus')});const cg=new THREE.Vector3(),tg=new THREE.Vector3();function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();asset.resize(w,h,renderer.getPixelRatio())}new ResizeObserver(resize).observe(host);resize();setStep(0);fitSceneToView({THREE,scene,camera,controls,roots:assetRoots(),direction:new THREE.Vector3(...CAM[0]).sub(new THREE.Vector3(...TGT[0])),padding:1.32});cameraSettling=false;function frame(now){requestAnimationFrame(frame);if(playing)t=(now-start)/1000;last=asset.update(t);hud();if(stepPose){cg.copy(stepPose.position);tg.copy(stepPose.target)}if(cameraSettling&&!matchMedia('(prefers-reduced-motion: reduce)').matches){camera.position.lerp(cg,.025);controls.target.lerp(tg,.035);if(camera.position.distanceTo(cg)<.03&&controls.target.distanceTo(tg)<.03)cameraSettling=false}controls.update();renderer.render(scene,camera)}requestAnimationFrame(frame);</script></body></html>
