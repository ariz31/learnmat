EE.DirectionalLight(0xffffff,3);sun.position.set(6,10,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.00025;scene.add(sun);const fill=new THREE.DirectionalLight(0x9fc9d8,.55);fill.position.set(-7,5,-6);scene.add(fill);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.25,0);controls.minDistance=5;controls.maxDistance=19;let cameraSettling=true;controls.addEventListener('start',()=>cameraSettling=false);const asset=createAsset({container:host,three:THREE,scene,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});const STEPS=[['Set the boundaries','The two water bodies represent fixed total-head boundaries. The amber line only normalizes their relative head for display.'],['Compute gradient','i = (h₁−h₂)/L. Sign is retained, so reversing heads reverses the modeled direction.'],['Apply Darcy','q = ki and Q = qA. Straight tracer lanes represent this solved 1-D model only.'],['Check the limits','Equal heads make i=q=Q=0. The scene never presents the tracks as a computed 2-D flow net.']];const CAM=[[8,4.8,8],[3,5.5,9],[-7,3.4,7],[7,2.4,-7]],TGT=[[0,.3,0],[0,1,0],[0,-.2,0],[0,0,0]];let step=0,playing=true,t=0,start=performance.now(),last=asset.snapshot();document.querySelector('#steps').innerHTML=STEPS.map((s,i)=>'<button class="step" data-i="'+i+'">'+(i+1)+' '+s[0]+'</button>').join('');function hud(){const s=last.state;document.querySelector('#hud').innerHTML=[['Δh',s.headDrop.toFixed(3)+' m'],['Gradient i',s.hydraulicGradient.toFixed(5)],['Darcy q',s.darcyFlux.toExponential(3)+' m/s'],['Area',s.area.toFixed(2)+' m²'],['Discharge Q',s.discharge.toExponential(3)+' m³/s'],['Mid-head',s.headAtMidpoint.toFixed(2)+' m']].map(x=>'<div class="m"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}function setStep(i){cameraSettling=true;step=(i+4)%4;document.querySelectorAll('.step').forEach((b,j)=>b.classList.toggle('active',j===step));document.querySelector('#lesson').innerHTML='<div class="k">Step '+(step+1)+' / 4</div><h2>'+STEPS[step][0]+'</h2><p>'+STEPS[step][1]+'</p><details><summary>Scope</summary><p>Steady, homogeneous, constant-area, one-dimensional Darcy flow. Tracks are not a flow-net solution.</p></details>';hud()}document.querySelector('#steps').onclick=e=>{const b=e.target.closest('.step');if(b)setStep(+b.dataset.i)};document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play';if(playing)start=performance.now()-t*1000};document.querySelector('#reset').onclick=()=>{t=0;start=performance.now();last=asset.reset();setStep(0)};const focusButton=document.querySelector('#focus');function setFocusState(active){stage.classList.toggle('focus',active);focusButton.setAttribute('aria-pressed',String(active));focusButton.textContent=active?'Exit focus':'Focus'}focusButton.onclick=async()=>{const active=!stage.classList.contains('focus');setFocusState(active);if(active){try{await stage.requestFullscreen?.()}catch{}}else if(document.fullscreenElement)await document.exitFullscreen?.()};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)setFocusState(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stage.classList.contains('focus')&&!document.fullscreenElement)setFocusState(false)});const cg=new THREE.Vector3(),tg=new THREE.Vector3();function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();asset.resize(w,h,renderer.getPixelRatio())}new ResizeObserver(resize).observe(host);resize();setStep(0);function frame(now){requestAnimationFrame(frame);if(playing)t=(now-start)/1000;last=asset.update(t);hud();cg.fromArray(CAM[step]);tg.fromArray(TGT[step]);if(cameraSettling&&!matchMedia('(prefers-reduced-motion: reduce)').matches){camera.position.lerp(cg,.025);controls.target.lerp(tg,.035);if(camera.position.distanceTo(cg)<.03&&controls.target.distanceTo(tg)<.03)cameraSettling=false}controls.update();renderer.render(scene,camera)}requestAnimationFrame(frame);</script></body></html>
