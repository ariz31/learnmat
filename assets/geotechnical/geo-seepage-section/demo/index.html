<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1-D Darcy seepage</title><style>body{font:15px system-ui,sans-serif;margin:0;padding:24px;background:#eef5f8;color:#10212b}main{max-width:980px;margin:auto;display:grid;gap:16px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;background:#fff;padding:14px;border-radius:12px}label{display:grid;gap:4px}</style></head><body><main><h1>1-D seepage with fixed heads</h1><p>Homogeneous Darcy-flow learning model. The total-head line is linear because the model assumes one-dimensional steady flow with constant hydraulic conductivity and section area.</p><form id="controls" class="controls"><label>Length L (m)<input name="length" type="number" step=".5" value="12"></label><label>Thickness (m)<input name="thickness" type="number" step=".1" value="4"></label><label>Out-of-plane width (m)<input name="widthOutOfPlane" type="number" step=".1" value="1"></label><label>Hydraulic conductivity k (m/s)<input name="hydraulicConductivity" type="number" step=".000001" value=".00002"></label><label>Upstream head h₁ (m)<input name="upstreamHead" type="number" step=".1" value="8"></label><label>Downstream head h₂ (m)<input name="downstreamHead" type="number" step=".1" value="3"></label></form><div id="asset"></div><p id="status" role="status"></p></main><script type="module">import{createAsset}from'../src/asset.mjs';const a=createAsset({container:document.querySelector('#asset'),seed:1,reducedMotion:true});const f=document.querySelector('#controls'),s=document.querySelector('#status');f.addEventListener('input',()=>{try{a.setParameters({length:+f.length.value,thickness:+f.thickness.value,widthOutOfPlane:+f.widthOutOfPlane.value,hydraulicConductivity:+f.hydraulicConductivity.value,upstreamHead:+f.upstreamHead.value,downstreamHead:+f.downstreamHead.value});s.textContent='';}catch(e){s.textContent=e.message;}});</script></body></html>
