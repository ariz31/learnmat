<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="One-dimensional seepage section with fixed heads"><rect width="960" height="540" fill="#f5f8fa"/><text x="55" y="65" font-family="system-ui" font-size="30" font-weight="700" fill="#10212b">1-D Darcy seepage · fixed-head boundaries</text><rect x="190" y="245" width="580" height="150" fill="#c7a77b" stroke="#6b5a48" stroke-width="4"/><line x1="190" y1="135" x2="770" y2="205" stroke="#1686b0" stroke-width="7"/><circle cx="190" cy="135" r="10" fill="#1686b0"/><circle cx="770" cy="205" r="10" fill="#1686b0"/><text x="190" y="112" text-anchor="middle" font-family="system-ui" font-size="19" fill="#10212b">h₁ = 8 m</text><text x="770" y="182" text-anchor="middle" font-family="system-ui" font-size="19" fill="#10212b">h₂ = 3 m</text><text x="480" y="330" text-anchor="middle" font-family="system-ui" font-size="42" fill="#1686b0">→</text><text x="480" y="435" text-anchor="middle" font-family="system-ui" font-size="19" fill="#10212b">i = 0.4167 · q = 8.333×10⁻⁶ m/s · Q = 3.333×10⁻⁵ m³/s</text><text x="480" y="485" text-anchor="middle" font-family="system-ui" font-size="17" fill="#48616e">Linear total-head profile under homogeneous 1-D Darcy assumptions — not a 2-D flow net</text></svg>
