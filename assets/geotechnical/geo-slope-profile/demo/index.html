<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slope profile</title><style>body{font:15px system-ui,sans-serif;margin:0;padding:24px;background:#eef5f8;color:#10212b}main{max-width:980px;margin:auto;display:grid;gap:16px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;background:#fff;padding:14px;border-radius:12px}label{display:grid;gap:4px}</style></head><body><main><h1>Slope profile — scoped infinite-slope model</h1><p>This is a planar unit-area infinite-slope learning model. Soil thickness is measured normal to the slope, and friction angle is supplied in radians at the component API.</p><form id="controls" class="controls"><label>Height H (m)<input name="height" type="number" step=".1" value="6"></label><label>Horizontal run (m)<input name="horizontalRun" type="number" step=".1" value="9"></label><label>Normal soil thickness z (m)<input name="normalThickness" type="number" step=".1" value="1.5"></label><label>Unit weight γ (kN/m³)<input name="unitWeight" type="number" step=".1" value="18"></label><label>Cohesion c′ (kPa)<input name="cohesion" type="number" step=".1" value="5"></label><label>Friction angle φ′ (rad)<input name="frictionAngle" type="number" step=".01" value=".55850536064"></label><label>Pore pressure ratio u/σn<input name="porePressureRatioToNormal" type="number" min="0" max=".999" step=".05" value=".2"></label></form><div id="asset"></div><p id="status" role="status"></p></main><script type="module">import{createAsset}from'../src/asset.mjs';const a=createAsset({container:document.querySelector('#asset'),seed:1,reducedMotion:true});const f=document.querySelector('#controls'),s=document.querySelector('#status');f.addEventListener('input',()=>{try{a.setParameters({height:+f.height.value,horizontalRun:+f.horizontalRun.value,normalThickness:+f.normalThickness.value,unitWeight:+f.unitWeight.value,cohesion:+f.cohesion.value,frictionAngle:+f.frictionAngle.value,porePressureRatioToNormal:+f.porePressureRatioToNormal.value});s.textContent='';}catch(e){s.textContent=e.message;}});</script></body></html>
