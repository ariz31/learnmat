<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Slope Stability · LearnMat</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script><style>:root{--bg:#0a1112;--panel:#111d1ee8;--line:#c7e2de24;--text:#f4fbf8;--muted:#a5b8b3;--cyan:#65e6ff;--amber:#ffbd59;--red:#ff7076}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 78% 7%,#263a30,#0a1112 50%,#050708);color:var(--text);font:14px system-ui}.stage{position:relative;width:100%;height:100%}#threeHost{position:absolute;inset:0}.head{position:absolute;left:22px;top:18px;z-index:6}.e{font-size:10px;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase;font-weight:850}.head h1{margin:5px 0 0;font:500 clamp(25px,4vw,43px) Georgia,serif}.head p{margin:5px 0;color:var(--muted);font-size:12px}.tools{position:absolute;right:18px;top:18px;display:flex;gap:6px;z-index:9}.btn,.step{border:1px solid var(--line);background:#101c1ddd;color:var(--text);border-radius:9px;padding:8px 10px;font:700 11px system-ui;cursor:pointer}.btn.primary,.step.active{background:var(--cyan);color:#03232d}.steps{position:absolute;left:22px;top:105px;display:flex;gap:5px;flex-wrap:wrap;z-index:8}.step{border-radius:999px;padding:6px 9px;color:var(--muted);font-size:10px}.hud{position:absolute;left:22px;bottom:22px;display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:7px;z-index:7}.m,.lesson{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);box-shadow:0 22px 70px #0008}.m{border-radius:11px;padding:9px 11px}.m span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.m b{display:block;margin-top:4px;font-size:15px}.lesson{position:absolute;right:22px;bottom:22px;width:min(390px,44vw);padding:14px;border-radius:14px;z-index:7}.lesson .k{color:var(--cyan);font-size:10px;font-weight:850;text-transform:uppercase}.lesson h2{margin:5px 0;font-size:18px}.lesson p,.lesson details{color:var(--muted);font-size:12px;line-height:1.45}.focus .head,.focus .steps,.focus .hud,.focus .lesson{opacity:0;pointer-events:none}@media(max-width:760px){.head{left:12px}.head h1{font-size:25px}.steps{left:12px;top:92px}.hud{left:12px;bottom:12px;grid-template-columns:1fr 1fr;max-width:58vw}.lesson{right:12px;bottom:12px;width:40vw;padding:10px}.tools{right:10px;top:10px}}</style></head><body><main class="stage" id="stage"><div id="threeHost"></div><header class="head"><div class="e">Geotechnical · 3D teaching plate</div><h1>Scoped infinite-slope model</h1><p>Terrain geometry → stresses on a planar slice → pore pressure → model FS</p></header><div class="tools"><button class="btn primary" id="play">Pause</button><button class="btn" id="reset">Reset</button><button class="btn" id="focus">Focus</button></div><nav class="steps" id="steps"></nav><section class="hud" id="hud"></section><aside class="lesson" id="lesson"></aside></main><script type="module">import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{createAsset}from'../src/asset.mjs';const host=document.querySelector('#threeHost'),stage=document.querySelector('#stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0x0a1112);scene.fog=new THREE.Fog(0x0a1112,14,32);const camera=new THREE.PerspectiveCamera(40,1,.05,100);camera.position.set(8,5.2,8);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd9efe4,0x2b2118,1.45));const sun=new THREE.DirectionalLight(0xfff5dd,3);sun.position.set(7,11,5);sun.castShadow=true;scene.add(sun);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1,0);controls.minDistance=5;controls.maxDistance=19;const asset=createAsset({container:host,three:THREE,scene,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});const STEPS=[['Build the slope','H and horizontal run set β exactly. The terrain size is normalized, but its displayed angle follows the analytical geometry.'],['Define the slice','The amber plane is the explicitly scoped infinite-slope slice—not a circular slip surface. Thickness z is normal to the slope in the model.'],['Resolve stresses','Red marks downslope driving shear; cyan marks the normal direction. Pore-pressure markers reduce effective normal stress through the input ratio u/σn.'],['Compute model FS','Resistance = c′ + σ′n tanφ′ and FS = resistance/driving. The demo reports the result without assigning a safe/unsafe verdict.']];const CAM=[[8,5.2,8],[3.6,3.2,9],[-7,4.2,7],[7,2.7,-7]],TGT=[[0,1,0],[0,1.2,0],[0,1.1,0],[0,.9,0]];let step=0,playing=true,t=0,start=performance.now(),last=asset.snapshot();document.querySelector('#steps').innerHTML=STEPS.map((s,i)=>'<button class="step" data-i="'+i+'">'+(i+1)+' '+s[0]+'</button>').join('');function hud(){const s=last.state;document.querySelector('#hud').innerHTML=[['β',(s.slopeAngle*180/Math.PI).toFixed(2)+'°'],['Slope L',s.slopeLength.toFixed(2)+' m'],['Driving τ',s.drivingShearStress.toFixed(2)+' kPa'],['σ′n',s.effectiveNormalStress.toFixed(2)+' kPa'],['Resistance',s.shearResistance.toFixed(2)+' kPa'],['Model FS',s.factorOfSafety.toFixed(3)]].map(x=>'<div class="m"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}function setStep(i){step=(i+4)%4;document.querySelectorAll('.step').forEach((b,j)=>b.classList.toggle('active',j===step));document.querySelector('#lesson').innerHTML='<div class="k">Step '+(step+1)+' / 4</div><h2>'+STEPS[step][0]+'</h2><p>'+STEPS[step][1]+'</p><details><summary>Scope</summary><p>Unit-area planar infinite-slope slice. Not Bishop/Janbu/Spencer, not circular-slip search, not FE analysis.</p></details>';hud()}document.querySelector('#steps').onclick=e=>{const b=e.target.closest('.step');if(b)setStep(+b.dataset.i)};document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play';if(playing)start=performance.now()-t*1000};document.querySelector('#reset').onclick=()=>{t=0;start=performance.now();last=asset.reset();setStep(0)};document.querySelector('#focus').onclick=async()=>{stage.classList.toggle('focus');if(stage.classList.contains('focus')){try{await stage.requestFullscreen?.()}catch{}}else if(document.fullscreenElement)await document.exitFullscreen?.()};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)stage.classList.remove('focus')});const cg=new THREE.Vector3(),tg=new THREE.Vector3();function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();asset.resize(w,h,renderer.getPixelRatio())}new ResizeObserver(resize).observe(host);resize();setStep(0);function frame(now){requestAnimationFrame(frame);if(playing)t=(now-start)/1000;last=asset.update(t);hud();cg.fromArray(CAM[step]);tg.fromArray(TGT[step]);if(!matchMedia('(prefers-reduced-motion: reduce)').matches){camera.position.lerp(cg,.025);controls.target.lerp(tg,.035)}controls.update();renderer.render(scene,camera)}requestAnimationFrame(frame);</script></body></html>
