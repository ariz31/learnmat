uerySelector('#stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1114);scene.fog=new THREE.Fog(0x0b1114,14,30);const camera=new THREE.PerspectiveCamera(40,1,.05,90);camera.position.set(7,4.6,7);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd8eee8,0x2b2119,1.45));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(6,10,5);sun.castShadow=true;scene.add(sun);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.1,0);controls.minDistance=5;controls.maxDistance=18;let cameraSettling=true;controls.addEventListener('start',()=>cameraSettling=false);const assetSceneChildren=new Set(scene.children);const asset=createAsset({container:host,three:THREE,scene,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});const assetRoots=()=>scene.children.filter(child=>!assetSceneChildren.has(child));const STEPS=[['Read P and M','The red load arrow is applied at the model eccentricity while the amber cue identifies the applied moment.'],['Locate the resultant','e = M/P. Compare |e| with B/6 before trusting a full-contact linear pressure distribution.'],['Read compression','Blue reaction arrows interpolate the model edge pressures across the footing base. Their lengths are normalized for visibility.'],['Check the assumption','If qmin < 0, soil tension is impossible. The red zone flags the invalid full-contact assumption; this asset does not fabricate redistributed contact.']];const CAM=[[7,4.6,7],[3,5.5,8],[-6,2.7,7],[7,1.5,-7]],TGT=[[0,.2,0],[0,1.2,0],[0,-.2,0],[0,-.15,0]];let stepPose=null,step=0,playing=true,t=0,start=performance.now(),last=asset.snapshot();document.querySelector('#steps').innerHTML=STEPS.map((s,i)=>'<button class="step" data-i="'+i+'">'+(i+1)+' '+s[0]+'</button>').join('');function hud(){const s=last.state;document.querySelector('#hud').innerHTML=[['q avg',s.averagePressure.toFixed(1)+' kPa'],['e',s.eccentricity.toFixed(3)+' m'],['B/6',s.kernLimit.toFixed(3)+' m'],['q min',s.minPressure.toFixed(1)+' kPa'],['q max',s.maxPressure.toFixed(1)+' kPa'],['Contact',s.fullContact?'full':'assumption invalid']].map(x=>'<div class="m"><span>'+x[0]+'</span><b class="'+(x[0]=='Contact'&&!s.fullContact?'warn':'')+'">'+x[1]+'</b></div>').join('')}function setStep(i){cameraSettling=true;step=(i+4)%4;const direction=new THREE.Vector3(...CAM[step]).sub(new THREE.Vector3(...TGT[step]));stepPose=getFitPose({THREE,camera,roots:assetRoots(),direction,padding:1.32});extendSceneFog(scene,stepPose);if(stepPose&&matchMedia('(prefers-reduced-motion: reduce)').matches){camera.position.copy(stepPose.position);controls.target.copy(stepPose.target);cameraSettling=false;controls.update()}document.querySelectorAll('.step').forEach((b,j)=>b.classList.toggle('active',j===step));const s=last.state;document.querySelector('#lesson').innerHTML='<div class="k">Step '+(step+1)+' / 4</div><h2>'+STEPS[step][0]+'</h2><p>'+STEPS[step][1]+'</p><details><summary>Relation</summary><p>q = P/(BL) ± 6M/(LB²); full-contact criterion |e| ≤ B/6.</p></details>'+(s.fullContact?'':'<p class="warn">qmin &lt; 0 — no-tension redistribution is outside this model.</p>');hud()}document.querySelector('#steps').onclick=e=>{const b=e.target.closest('.step');if(b)setStep(+b.dataset.i)};document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play';if(playing)start=performance.now()-t*1000};document.querySelector('#overview').onclick=()=>{cameraSettling=false;fitSceneToView({THREE,scene,camera,controls,roots:assetRoots(),direction:camera.position.clone().sub(controls.target),padding:1.32})};document.querySelector('#reset').onclick=()=>{t=0;start=performance.now();last=asset.reset();setStep(0)};document.querySelector('#focus').onclick=async()=>{stage.classList.toggle('focus');if(stage.classList.contains('focus')){try{await stage.requestFullscreen?.()}catch{}}else if(document.fullscreenElement)await document.exitFullscreen?.()};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)stage.classList.remove('focus')});const cg=new THREE.Vector3(),tg=new THREE.Vector3();function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();asset.resize(w,h,renderer.getPixelRatio())}new ResizeObserver(resize).observe(host);resize();setStep(0);fitSceneToView({THREE,scene,camera,controls,roots:assetRoots(),direction:new THREE.Vector3(...CAM[0]).sub(new THREE.Vector3(...TGT[0])),padding:1.32});cameraSettling=false;function frame(now){requestAnimationFrame(frame);if(playing)t=(now-start)/1000;last=asset.update(t);hud();if(stepPose){cg.copy(stepPose.position);tg.copy(stepPose.target)}if(cameraSettling&&!matchMedia('(prefers-reduced-motion: reduce)').matches){camera.position.lerp(cg,.025);controls.target.lerp(tg,.035);if(camera.position.distanceTo(cg)<.03&&controls.target.distanceTo(tg)<.03)cameraSettling=false}controls.update();renderer.render(scene,camera)}requestAnimationFrame(frame);</script></body></html>
