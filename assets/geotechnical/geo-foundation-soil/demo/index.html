<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Footing contact pressure</title><style>body{font:15px system-ui,sans-serif;margin:0;padding:24px;background:#eef5f8;color:#10212b}main{max-width:980px;margin:auto;display:grid;gap:16px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;background:#fff;padding:14px;border-radius:12px}label{display:grid;gap:4px}</style></head><body><main><h1>Shallow footing contact pressure</h1><p>Rigid rectangular footing under vertical load and one-axis moment. The linear pressure distribution is only treated as valid while it remains compressive across the full base.</p><form id="controls" class="controls"><label>Width B (m)<input name="footingWidth" type="number" step=".1" value="2"></label><label>Length L (m)<input name="footingLength" type="number" step=".1" value="3"></label><label>Vertical load P (kN)<input name="verticalLoad" type="number" step="10" value="1200"></label><label>Moment M (kN·m)<input name="moment" type="number" step="10" value="100"></label></form><div id="asset"></div><p id="status" role="status"></p></main><script type="module">import{createAsset}from'../src/asset.mjs';const a=createAsset({container:document.querySelector('#asset'),seed:1,reducedMotion:true});const f=document.querySelector('#controls'),s=document.querySelector('#status');f.addEventListener('input',()=>{try{a.setParameters({footingWidth:+f.footingWidth.value,footingLength:+f.footingLength.value,verticalLoad:+f.verticalLoad.value,moment:+f.moment.value});s.textContent='';}catch(e){s.textContent=e.message;}});</script></body></html>
