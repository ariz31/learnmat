<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reinforcement cage</title><style>body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f6f7f9;color:#111827}main{max-width:1000px;margin:auto;padding:24px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}label{display:grid;gap:4px;font-weight:650}input,button{font:inherit;padding:7px}pre{white-space:pre-wrap}</style></head><body><main><h1>Parametric reinforcement cage</h1><p>Detailing geometry only; no design-code compliance is inferred.</p><div class="controls"><label>Width (m)<input id="w" type="number" value=".45" step=".01"></label><label>Depth (m)<input id="d" type="number" value=".45" step=".01"></label><label>Height (m)<input id="h" type="number" value="3" step=".1"></label><label>Clear cover (m)<input id="c" type="number" value=".04" step=".005"></label><label>Long bar dia (m)<input id="bd" type="number" value=".02" step=".001"></label><label>Tie dia (m)<input id="td" type="number" value=".01" step=".001"></label><label>Bars along width<input id="bw" type="number" value="3" step="1"></label><label>Bars along depth<input id="bz" type="number" value="3" step="1"></label><label>Max tie spacing (m)<input id="ts" type="number" value=".2" step=".01"></label><button id="r" type="button">Reset</button></div><div id="asset-root"></div><pre id="out" aria-live="polite"></pre></main><script type="module">import{createAsset}from'../src/asset.mjs';const q=id=>document.getElementById(id),root=q('asset-root'),w=q('w'),d=q('d'),h=q('h'),c=q('c'),bd=q('bd'),td=q('td'),bw=q('bw'),bz=q('bz'),ts=q('ts'),r=q('r'),out=q('out'),a=createAsset({container:root,seed:1,reducedMotion:true});function sync(){try{a.setParameters({widthM:+w.value,depthM:+d.value,heightM:+h.value,clearCoverM:+c.value,longitudinalBarDiameterM:+bd.value,tieDiameterM:+td.value,barsAlongWidth:+bw.value,barsAlongDepth:+bz.value,maxTieSpacingM:+ts.value});const s=a.snapshot();out.textContent='Longitudinal bars: '+s.longitudinalBarCount+'\nTies: '+s.tieCount+'\nActual tie spacing: '+(s.actualTieSpacingM*1000).toFixed(1)+' mm';}catch(err){out.textContent=err.message;}}for(const input of[w,d,h,c,bd,td,bw,bz,ts])input.addEventListener('input',sync);r.addEventListener('click',()=>{a.reset();w.value=.45;d.value=.45;h.value=3;c.value=.04;bd.value=.02;td.value=.01;bw.value=3;bz.value=3;ts.value=.2;sync();});a.resize(Math.min(930,root.clientWidth||930),500,devicePixelRatio||1);sync();</script></body></html>
