<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LearnMat · Floor Assembly</title>
  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color:#172033;background:#f5f7fa}
    *{box-sizing:border-box}
    body{margin:0;padding:20px}
    main{max-width:1160px;margin:auto;display:grid;grid-template-columns:minmax(240px,310px) minmax(0,1fr);gap:16px;align-items:start}
    form{background:#fff;border:1px solid #d7deea;border-radius:14px;padding:16px;display:grid;gap:11px}
    h1{font-size:1.2rem;margin:0 0 4px}
    .note{font-size:.84rem;color:#58677a;margin:0}
    label{display:grid;gap:5px;font-size:.84rem;font-weight:650}
    input{width:100%;padding:8px;border:1px solid #aeb9c7;border-radius:8px;font:inherit}
    button{padding:9px 12px;border:1px solid #8291a4;border-radius:9px;background:#fff;font:inherit;font-weight:650;cursor:pointer}
    #error{min-height:1.3em;color:#a33;font-size:.82rem}
    @media(max-width:760px){body{padding:10px}main{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <form id="controls">
      <div>
        <h1>Exploded floor assembly</h1>
        <p class="note">Layer geometry only. Structural capacity and code compliance are outside this asset.</p>
      </div>
      <label>Floor finish (mm)<input name="finishThickness" type="number" min="5" max="40" step="1" value="12"></label>
      <label>Screed / bedding (mm)<input name="screedThickness" type="number" min="10" max="100" step="5" value="40"></label>
      <label>Slab geometry (mm)<input name="slabThickness" type="number" min="80" max="400" step="10" value="150"></label>
      <label>Service void (mm)<input name="serviceVoid" type="number" min="0" max="1000" step="25" value="300"></label>
      <label>Ceiling board (mm)<input name="ceilingBoardThickness" type="number" min="6" max="30" step="1" value="12"></label>
      <label>Exploded display gap (mm)<input name="explodeGap" type="range" min="0" max="250" step="10" value="80"></label>
      <button type="button" id="reset">Reset defaults</button>
      <div id="error" role="status" aria-live="polite"></div>
    </form>
    <div id="asset"></div>
  </main>

  <script type="module">
    import { createAsset } from "../src/asset.mjs";

    const form = document.querySelector("#controls");
    const error = document.querySelector("#error");
    const asset = createAsset({
      container: document.querySelector("#asset"),
      reducedMotion: matchMedia("(prefers-reduced-motion: reduce)").matches
    });

    const mm = (data, name) => Number(data.get(name)) / 1000;

    function values() {
      const data = new FormData(form);
      return {
        finishThickness: mm(data, "finishThickness"),
        screedThickness: mm(data, "screedThickness"),
        slabThickness: mm(data, "slabThickness"),
        serviceVoid: mm(data, "serviceVoid"),
        ceilingBoardThickness: mm(data, "ceilingBoardThickness"),
        explodeGap: mm(data, "explodeGap")
      };
    }

    form.addEventListener("input", () => {
      try {
        asset.setParameters(values());
        error.textContent = "";
      } catch (reason) {
        error.textContent = reason instanceof Error ? reason.message : String(reason);
      }
    });

    document.querySelector("#reset").addEventListener("click", () => {
      form.reset();
      asset.reset();
      error.textContent = "";
    });

    addEventListener("beforeunload", () => asset.dispose(), { once: true });
  </script>
</body>
</html>
