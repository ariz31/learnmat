<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Exploded floor assembly default reference</title>
  <desc id="desc">Five-part floor assembly showing floor finish, screed, slab geometry, service void, and ceiling board with dimension labels.</desc>
  <rect width="1200" height="760" fill="#f4f7fa"/>
  <text x="70" y="72" font-family="system-ui,sans-serif" fill="#172033" font-size="30" font-weight="750">Exploded Floor Assembly</text>
  <text x="70" y="110" font-family="system-ui,sans-serif" fill="#58677a" font-size="20">Default reference · physical build-up 514 mm · solid thickness 214 mm</text>

  <g stroke="#425466" stroke-width="2">
    <polygon points="260,600 650,600 790,530 400,530" fill="#f0eee7"/>
    <polygon points="260,590 650,590 650,600 260,600" fill="#e7e4da"/>
    <polygon points="260,590 400,520 400,530 260,600" fill="#ddd9cf"/>

    <polygon points="260,475 650,475 790,405 400,405" fill="#dbe8f3" fill-opacity=".22" stroke="#6c89a5" stroke-dasharray="10 7"/>
    <polygon points="260,360 650,360 650,475 260,475" fill="#dbe8f3" fill-opacity=".08" stroke="#6c89a5" stroke-dasharray="10 7"/>

    <polygon points="260,310 650,310 790,240 400,240" fill="#c2c8cf"/>
    <polygon points="260,255 650,255 650,310 260,310" fill="#b7bec6"/>
    <polygon points="260,255 400,185 400,240 260,310" fill="#aab2ba"/>

    <polygon points="260,195 650,195 790,125 400,125" fill="#dfdcd6"/>
    <polygon points="260,180 650,180 650,195 260,195" fill="#d8d5cf"/>

    <polygon points="260,115 650,115 790,45 400,45" fill="#cfb99a"/>
    <polygon points="260,106 650,106 650,115 260,115" fill="#c9b18e"/>
  </g>

  <g font-family="system-ui,sans-serif" fill="#27394b" font-size="19" font-weight="650">
    <text x="835" y="585">Ceiling board · 12 mm</text>
    <text x="835" y="420">Service void · 300 mm</text>
    <text x="835" y="285">Slab geometry · 150 mm</text>
    <text x="835" y="192">Screed / bedding · 40 mm</text>
    <text x="835" y="113">Floor finish · 12 mm</text>
  </g>

  <g stroke="#6b7b8e" stroke-width="2" stroke-dasharray="5 5">
    <line x1="660" y1="595" x2="815" y2="580"/>
    <line x1="660" y1="420" x2="815" y2="415"/>
    <line x1="660" y1="282" x2="815" y2="280"/>
    <line x1="660" y1="190" x2="815" y2="188"/>
    <line x1="660" y1="111" x2="815" y2="109"/>
  </g>

  <text x="70" y="700" font-family="system-ui,sans-serif" fill="#59697a" font-size="18">Vertical thicknesses and exploded gaps are visually exaggerated for clarity.</text>
</svg>
