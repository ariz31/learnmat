<style>:root{--bg:#07131b;--panel:#081b27e8;--line:#a5e7f12b;--text:#effbff;--muted:#91aeb9;--cyan:#6ce5ff;--amber:#ffbd59}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 80% 5%,#164458 0,#07131b 43%,#04090e 100%);color:var(--text);font:14px Inter,system-ui,sans-serif}.stage{position:relative;width:100%;height:100%}#threeHost{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}.head{position:absolute;left:22px;top:18px;z-index:6}.e{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:850}.head h1{margin:5px 0 0;font:500 clamp(25px,4vw,43px) Georgia,serif}.head p{margin:5px 0;color:var(--muted);font-size:12px}.tools{position:absolute;right:18px;top:18px;display:flex;gap:6px;z-index:9}.btn,.step{border:1px solid var(--line);background:#0a1a25dc;color:var(--text);border-radius:9px;padding:8px 10px;font:700 11px system-ui;cursor:pointer}.btn.primary,.step.active{background:var(--cyan);color:#03232d}.steps{position:absolute;left:22px;top:105px;display:flex;gap:5px;flex-wrap:wrap;z-index:8}.step{border-radius:999px;padding:6px 9px;color:var(--muted);font-size:10px}.cards{position:absolute;left:22px;bottom:22px;display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:7px;z-index:7;max-width:540px}.m,.lesson{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);box-shadow:0 22px 70px #0007}.m{border-radius:11px;padding:9px 11px}.m span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}.m b{display:block;margin-top:4px;font-size:15px}.lesson{position:absolute;right:22px;bottom:22px;width:min(360px,42vw);padding:14px;border-radius:14px;z-index:7}.lesson .k{color:var(--cyan);font:850 10px system-ui;text-transform:uppercase;letter-spacing:.1em}.lesson h2{margin:5px 0;font-size:18px}.lesson p,.lesson details{color:var(--muted);font-size:12px;line-height:1.46}.focus .head,.focu <body><main class="stage" id="stage"><div id="threeHost"></div><header class="head"><div class="e">Hydraulics · 3D teaching plate</div><h1>Open-channel flow</h1><p>Section geometry → velocity → Froude regime → Manning capacity</p></header><div class="tools"><button class="btn primary" id="play">Pause</button><button class="btn" id="reset">Reset</button><button class="btn" id="focus">Focus</button></div><nav class="steps" id="steps"></nav><section class="cards" id="cards"></section><aside class="lesson" id="lesson"></aside></main>
<script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{createAsset}from'../src/asset.mjs';const host=document.querySelector('#threeHost'),stage=document.querySelector('#stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0x07131b);scene.fog=new THREE.Fog(0x07131b,12,28);const camera=new THREE.PerspectiveCamera(42,1,.05,90);camera.position.set(7,4.8,7);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbceeff,0x1b252a,1.55));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(4,10,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);const rim=new THREE.DirectionalLight(0x39c8ff,1.3);rim.position.set(-6,4,-4);scene.add(rim);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.5,0);controls.minDistance=4;controls.maxDistance=18;const asset=createAsset({container:host,three:THREE,scene,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});
const STEPS=[['Read the section','The concrete floor, sidewalls, water prism and staff establish the real 3D section geometry.'],['Apply continuity','A = by and V = Q/A. Tracers move downstream with display-scaled speed while the HUD shows computed V.'],['Classify the flow','Fr = V/√(gD_h). The 3D scene stays spatial; the exact regime remains an analytical overlay.'],['Compare capacity','Manning capacity is evaluated at the specified depth. The amber longitudinal cue exaggerates bed slope for visibility and does not imply a solved normal depth.']];const CAM=[[7,4.8,7],[3.4,2.4,7],[-2,4.2,7],[7,3,-6]],TGT=[[0,.5,0],[0,.45,0],[0,.75,0],[0,.3,0]];let step=0,playing=true,t=0,start=performance.now(),last=asset.snapshot();document.querySelector('#steps').innerHTML=STEPS.map((s,i)=>'<button class="step" data-i="'+i+'">'+(i+1)+' '+s[0]+'</button>').join('');
function hud(){const s=last.state;document.querySelector('#cards').innerHTML=[['Area',s.area.toFixed(3)+' m²'],['Velocity',s.velocity.toFixed(3)+' m/s'],['Hydraulic R',s.hydraulicRadius.toFixed(3)+' m'],['Froude',s.froude.toFixed(3)],['Regime',s.regime],['Manning Q',s.manningCapacity.toFixed(3)+' m³/s']].map(x=>'<div class="m"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}
function setStep(i){step=(i+4)%4;document.querySelectorAll('.step').forEach((b,j)=>b.classList.toggle('active',j===step));document.querySelector('#lesson').innerHTML='<div class="k">Step '+(step+1)+' / 4</div><h2>'+STEPS[step][0]+'</h2><p>'+STEPS[step][1]+'</p><details><summary>Relations</summary><p>A=by · R=A/P · Fr=V/√(gD_h) · Q_M=(1/n)AR^(2/3)S^(1/2)</p></details>';hud()}document.querySelector('#steps').onclick=e=>{const b=e.target.closest('.step');if(b)setStep(+b.dataset.i)};document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play';if(playing)start=performance.now()-t*1000};document.querySelector('#reset').onclick=()=>{t=0;start=performance.now();last=asset.reset();setStep(0)};document.querySelector('#focus').onclick=async()=>{stage.classList.toggle('focus');if(stage.classList.contains('focus')){try{await stage.requestFullscreen?.()}catch{}}else if(document.fullscreenElement)await document.exitFullscreen?.()};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)stage.classList.remove('focus')});
const cg=new THREE.Vector3(),tg=new THREE.Vector3();function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();asset.resize(w,h,renderer.getPixelRatio())}new ResizeObserver(resize).observe(host);resize();setStep(0);function frame(now){requestAnimationFrame(frame);if(playing)t=(now-start)/1000;last=asset.update(t);hud();cg.fromArray(CAM[step]);tg.fromArray(TGT[step]);if(!matchMedia('(prefers-reduced-motion: reduce)').matches){camera.position.lerp(cg,.025);controls.target.lerp(tg,.035)}controls.update();renderer.render(scene,camera)}requestAnimationFrame(frame);</script></body></html>
