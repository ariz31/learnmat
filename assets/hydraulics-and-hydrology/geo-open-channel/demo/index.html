<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open channel asset demo</title><style>body{font:15px system-ui,sans-serif;margin:0;padding:24px;background:#eef5f8;color:#10212b}main{max-width:980px;margin:auto;display:grid;gap:16px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;background:#fff;padding:14px;border-radius:12px}label{display:grid;gap:4px}input{width:100%}</style></head><body><main><h1>Open-channel section</h1><p>This demo treats depth as a specified input. Manning discharge is shown only as the uniform-flow capacity corresponding to that specified depth and slope.</p><form class="controls" id="controls"><label>Width b (m)<input name="width" type="number" min=".05" step=".1" value="3"></label><label>Depth y (m)<input name="depth" type="number" min=".001" step=".05" value="1.2"></label><label>Discharge Q (m³/s)<input name="discharge" type="number" min="0" step=".1" value="4"></label><label>Bed slope S<input name="bedSlope" type="number" min="0" step=".0001" value=".0015"></label><label>Manning n<input name="manningN" type="number" min=".001" step=".001" value=".015"></label><label>Time (s)<input name="time" type="range" min="0" max="10" step=".1" value="0"></label></form><div id="asset"></div><p id="status" role="status"></p></main><script type="module">import{createAsset}from'../src/asset.mjs';const asset=createAsset({container:document.querySelector('#asset'),seed:1,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});const form=document.querySelector('#controls'),status=document.querySelector('#status');form.addEventListener('input',()=>{try{asset.setParameters({width:+form.width.value,depth:+form.depth.value,discharge:+form.discharge.value,bedSlope:+form.bedSlope.value,manningN:+form.manningN.value});asset.update(+form.time.value);status.textContent='';}catch(e){status.textContent=e.message;}});</script></body></html>
