<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pump/system operating point</title><style>body{font:15px system-ui,sans-serif;margin:0;padding:24px;background:#eef5f8;color:#10212b}main{max-width:980px;margin:auto;display:grid;gap:16px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;background:#fff;padding:14px;border-radius:12px}label{display:grid;gap:4px}</style></head><body><main><h1>Pump/system operating point</h1><p>The operating point is the analytical intersection of the stated quadratic pump and system curves. This is a learning model, not a manufacturer pump-selection tool.</p><form id="controls" class="controls"><label>Shutoff head H₀ (m)<input name="shutoffHead" type="number" step="1" value="36"></label><label>Pump coefficient kₚ<input name="pumpCoefficient" type="number" step="10" value="800"></label><label>Static head Hs (m)<input name="staticHead" type="number" step="1" value="8"></label><label>System coefficient Ks<input name="systemCoefficient" type="number" step="10" value="1200"></label><label>Efficiency η<input name="efficiency" type="number" min=".01" max="1" step=".01" value=".75"></label></form><div id="asset"></div><p id="status" role="status"></p></main><script type="module">import{createAsset}from'../src/asset.mjs';const a=createAsset({container:document.querySelector('#asset'),seed:1,reducedMotion:true});const f=document.querySelector('#controls'),s=document.querySelector('#status');f.addEventListener('input',()=>{try{a.setParameters({shutoffHead:+f.shutoffHead.value,pumpCoefficient:+f.pumpCoefficient.value,staticHead:+f.staticHead.value,systemCoefficient:+f.systemCoefficient.value,efficiency:+f.efficiency.value});s.textContent='';}catch(e){s.textContent=e.message;}});</script></body></html>
