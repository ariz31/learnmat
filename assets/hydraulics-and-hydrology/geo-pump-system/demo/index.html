<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Pump System · LearnMat</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script><style>:root{--bg:#07121b;--panel:#091b27e8;--line:#91d9ec2d;--text:#effaff;--muted:#96b0bc;--cyan:#62e4ff;--amber:#ffb957}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 80% 0,#123d52,#07121b 48%,#04090e);color:var(--text);font:14px system-ui}.stage{position:relative;width:100%;height:100%}#threeHost{position:absolute;inset:0}.head{position:absolute;left:22px;top:18px;z-index:6}.e{font-size:10px;letter-spacing:.16em;color:var(--cyan);font-weight:850;text-transform:uppercase}.head h1{margin:5px 0 0;font:500 clamp(25px,4vw,43px) Georgia,serif}.head p{margin:5px 0;color:var(--muted);font-size:12px}.tools{position:absolute;right:18px;top:18px;display:flex;gap:6px;z-index:9}.btn,.step{border:1px solid var(--line);background:#0a1b27dc;color:var(--text);border-radius:9px;padding:8px 10px;font:700 11px system-ui;cursor:pointer}.btn.primary,.step.active{background:var(--cyan);color:#03232d}.steps{position:absolute;left:22px;top:105px;display:flex;gap:5px;flex-wrap:wrap;z-index:8}.step{border-radius:999px;padding:6px 9px;color:var(--muted);font-size:10px}.hud{position:absolute;left:22px;bottom:22px;display:grid;grid-template-columns:repeat(2,minmax(145px,1fr));gap:7px;z-index:7}.m,.lesson,.plot{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);box-shadow:0 22px 70px #0007}.m{border-radius:11px;padding:9px 11px}.m span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.m b{display:block;margin-top:4px;font-size:15px}.lesson{position:absolute;right:22px;bottom:22px;width:min(370px,42vw);padding:14px;border-radius:14px;z-index:7}.lesson .k{color:var(--cyan);font-size:10px;font-weight:850;text-transform:uppercase}.lesson h2{margin:5px 0;font-size:18px}.lesson p{color:var(--muted);font-size:12px;line-height:1.45}.plot{margin-top:10px;border-radius:10px;padding:7px}.plot svg{display:block;width:100%;height:105px}.focus .head,.focus .steps,.focus .hud,.focus .lesson{opacity:0;pointer-events:none}@media(max-width:760px){.head{left:12px}.head h1{font-size:26px}.steps{left:12px;top:92px}.hud{left:12px;bottom:12px}.lesson{right:12px;bottom:12px;width:43vw;padding:10px}.tools{right:10px;top:10px}}</style></head><body><main class="stage" id="stage"><div id="threeHost"></div><header class="head"><div class="e">Hydraulics · 3D teaching plate</div><h1>Pump + system operating point</h1><p>Machine geometry in 3D · exact curve intersection in the analytical overlay</p></header><div class="tools"><button class="btn primary" id="play">Pause</button><button class="btn" id="reset">Reset</button><button class="btn" id="focus">Focus</button></div><nav class="steps" id="steps"></nav><section class="hud" id="hud"></section><aside class="lesson" id="lesson"></aside></main><script type="module">import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{createAsset}from'../src/asset.mjs';const host=document.querySelector('#threeHost'),stage=document.querySelector('#stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0x07121b);scene.fog=new THREE.Fog(0x07121b,13,28);const camera=new THREE.PerspectiveCamera(42,1,.05,80);camera.position.set(7,4,7);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xc6f2ff,0x18242a,1.5));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(6,9,5);sun.castShadow=true;scene.add(sun);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.9,0);controls.minDistance=4;controls.maxDistance=16;const asset=createAsset({container:host,three:THREE,scene,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});const STEPS=[['Identify the machine','Motor, casing, impeller region, suction line and discharge line establish the physical pumping system.'],['Read both curves','The operating point is not chosen visually: it is the analytical intersection of Hₚ=H₀−kₚQ² and Hs=Hstatic+KsQ².'],['Connect Q to the scene','At a valid intersection, the impeller rotates and tracers move through the suction/discharge path.'],['Check power','Hydraulic power is ρgQH; shaft input divides by the supplied efficiency. No manufacturer efficiency map is implied.']];const CAM=[[7,4,7],[5,5,-7],[3,2.4,7],[-6,3.2,5]],TGT=[[0,.9,0],[.4,1.2,0],[.2,1.05,0],[0,.9,0]];let step=0,playing=true,t=0,start=performance.now(),last=asset.snapshot();document.querySelector('#steps').innerHTML=STEPS.map((s,i)=>'<button class="step" data-i="'+i+'">'+(i+1)+' '+s[0]+'</button>').join('');function plot(){const s=last.state,p=last.parameters,op=s.operatingPoint;const q=op.exists?op.flow:0,h=op.exists?op.head:0;return '<div class="plot"><svg viewBox="0 0 280 105" aria-label="schematic pump and system curve plot"><path d="M18 15 Q140 30 260 92" fill="none" stroke="#62e4ff" stroke-width="3"/><path d="M18 88 Q140 70 260 18" fill="none" stroke="#ffb957" stroke-width="3"/>'+(op.exists?'<circle cx="142" cy="53" r="5" fill="#ff7f87"/>':'')+'<text x="20" y="12" fill="#62e4ff" font-size="9">pump</text><text x="224" y="15" fill="#ffb957" font-size="9">system</text><text x="145" y="70" fill="#eefaff" font-size="8">Q* '+q.toFixed(3)+' · H* '+h.toFixed(1)+'</text></svg></div>'}function hud(){const s=last.state,op=s.operatingPoint;document.querySelector('#hud').innerHTML=[['Operating Q',op.exists?op.flow.toFixed(4)+' m³/s':'none'],['Operating H',op.exists?op.head.toFixed(2)+' m':'—'],['Hydraulic power',(s.hydraulicPower/1000).toFixed(2)+' kW'],['Shaft power',(s.shaftPower/1000).toFixed(2)+' kW']].map(x=>'<div class="m"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}function setStep(i){step=(i+4)%4;document.querySelectorAll('.step').forEach((b,j)=>b.classList.toggle('active',j===step));document.querySelector('#lesson').innerHTML='<div class="k">Step '+(step+1)+' / 4</div><h2>'+STEPS[step][0]+'</h2><p>'+STEPS[step][1]+'</p>'+plot();hud()}document.querySelector('#steps').onclick=e=>{const b=e.target.closest('.step');if(b)setStep(+b.dataset.i)};document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play';if(playing)start=performance.now()-t*1000};document.querySelector('#reset').onclick=()=>{t=0;start=performance.now();last=asset.reset();setStep(0)};document.querySelector('#focus').onclick=async()=>{stage.classList.toggle('focus');if(stage.classList.contains('focus')){try{await stage.requestFullscreen?.()}catch{}}else if(document.fullscreenElement)await document.exitFullscreen?.()};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)stage.classList.remove('focus')});const cg=new THREE.Vector3(),tg=new THREE.Vector3();function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();asset.resize(w,h,renderer.getPixelRatio())}new ResizeObserver(resize).observe(host);resize();setStep(0);function frame(now){requestAnimationFrame(frame);if(playing)t=(now-start)/1000;last=asset.update(t);hud();cg.fromArray(CAM[step]);tg.fromArray(TGT[step]);if(!matchMedia('(prefers-reduced-motion: reduce)').matches){camera.position.lerp(cg,.025);controls.target.lerp(tg,.035)}controls.update();renderer.render(scene,camera)}requestAnimationFrame(frame);</script></body></html>
