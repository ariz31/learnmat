<style>:root{--bg:#07121b;--panel:#0a1823e8;--line:#9fd9ed2d;--text:#effaff;--muted:#94afbc;--cyan:#5cdefd;--amber:#ffbd5a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 18% 10%,#11354a 0,#07121b 44%,#040a0f 100%);color:var(--text);font:14px Inter,system-ui,sans-serif}.stage{position:relative;width:100%;height:100%}#threeHost{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}.brand{position:absolute;left:22px;top:18px;z-index:5}.eyebrow{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--cyan);font-weight:800}.brand h1{margin:5px 0 0;font:500 clamp(24px,4vw,42px) Georgia,serif}.brand p{margin:5px 0;color:var(--muted);font-size:12px}.toolbar{position:absolute;right:18px;top:18px;display:flex;gap:6px;z-index:8}.btn{border:1px solid var(--line);background:#0b1b26d9;color:var(--text);border-radius:9px;padding:8px 10px;font:700 11px system-ui;cursor:pointer}.btn.primary{background:var(--cyan);color:#03202b}.steps{position:absolute;left:22px;top:105px;display:flex;gap:5px;z-index:7;flex-wrap:wrap;max-width:min(720px,75vw)}.step{border:1px solid var(--line);background:#071723c9;color:var(--muted);border-radius:999px;padding:6px 9px;font-size:10px;cursor:pointer}.step.active{background:var(--cyan);color:#03202b;font-weight:800}.hud{position:absolute;left:22px;bottom:22px;display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:7px;z-index:6;max-width:520px}.metric,.lesson{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);box-shadow:0 20px 70px #0007}.metric{border-radius:11px;padding:9px 11px}.metric span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.09em}.metric b{display:block;margin-top:4px;font-size:15px}.lesson{position:absolute;right:22px;bottom:22px;width:min(360px,42vw);padding:14px;border-radius:14px;z-index:6}.lesson .k{font-size:10px;color:var(--cyan);letter-spacing:.1em; <body><main class="stage" id="stage"><div id="threeHost"></div><header class="brand"><div class="eyebrow">Hydraulics · 3D teaching plate</div><h1>Pipe flow & head loss</h1><p>Continuity → Reynolds regime → Darcy–Weisbach energy loss</p></header><div class="toolbar"><button class="btn primary" id="play">Pause</button><button class="btn" id="reset">Reset</button><button class="btn" id="focus">Focus</button></div><nav class="steps" id="steps"></nav><section class="hud" id="hud"></section><aside class="lesson" id="lesson"></aside></main>
<script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{createAsset}from'../src/asset.mjs';
const host=document.querySelector('#threeHost'),stage=document.querySelector('#stage');const scene=new THREE.Scene();scene.background=new THREE.Color(0x07121b);scene.fog=new THREE.Fog(0x07121b,11,25);
const camera=new THREE.PerspectiveCamera(43,1,.05,80);camera.position.set(7,4.6,7);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xaee9ff,0x182025,1.5));const sun=new THREE.DirectionalLight(0xffffff,3.2);sun.position.set(5,10,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);const rim=new THREE.DirectionalLight(0x4ecfff,1.7);rim.position.set(-7,4,-5);scene.add(rim);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.45,0);controls.minDistance=4;controls.maxDistance=17;let cameraSettling=true;controls.addEventListener('start',()=>cameraSettling=false);
const asset=createAsset({container:host,three:THREE,scene,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});
const STEPS=[['Trace continuity','Follow the water core and moving tracers. The animation is display-scaled; the model velocity remains the authoritative value.'],['Read regime','Use Re = |V|D/ν to identify laminar, transitional-approximation, or turbulent behavior.'],['See energy loss','The two head pylons make the computed Darcy–Weisbach loss spatially visible. Pylon separation is pedagogically exaggerated.'],['Check the relation','Verify h_f = f(L/D)V²/(2g). Reverse Q and the tracer direction reverses while loss remains a positive dissipative magnitude.']];
const CAM=[[7,4.6,7],[3.5,2.7,8],[-1,4.8,8],[7,3.1,-6]],TGT=[[0,.5,0],[0,.35,0],[1.7,1.1,0],[0,.5,0]];let step=0,playing=true,start=performance.now(),offset=0,last=asset.snapshot();
function setStep(i){cameraSettling=true;step=(i+STEPS.length)%STEPS.length;[...document.querySelectorAll('.step')].forEach((b,j)=>b.classList.toggle('active',j===step));document.querySelector('#lesson').innerHTML='<div class="k">Step '+(step+1)+' / '+STEPS.length+'</div><h2>'+STEPS[step][0]+'</h2><p>'+STEPS[step][1]+'</p><details><summary>Show governing model</summary><p>Q = AV · Re = |V|D/ν · h_f = f(L/D)V²/(2g)</p></details>';last=asset.snapshot();renderHud();}
function renderHud(){const s=last.state;document.querySelector('#hud').innerHTML=[['Velocity',s.velocity.toFixed(3)+' m/s'],['Reynolds',Math.round(s.reynolds).toLocaleString()],['f',s.frictionFactor.toFixed(4)],['Head loss',s.headLoss.toFixed(3)+' m'],['Regime',s.regime],['Q',last.parameters.flowRate.toFixed(3)+' m³/s']].map(x=>'<div class="metric"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');}
document.querySelector('#steps').innerHTML=STEPS.map((s,i)=>'<button class="step" data-i="'+i+'">'+(i+1)+' '+s[0]+'</button>').join('');document.querySelector('#steps').addEventListener('click',e=>{const b=e.target.closest('.step');if(b)setStep(+b.dataset.i)});
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play';if(playing)start=performance.now()-offset*1000};document.querySelector('#reset').onclick=()=>{offset=0;start=performance.now();asset.reset();last=asset.snapshot();setStep(0)};document.querySelector('#focus').onclick=async()=>{stage.classList.toggle('focus');if(stage.classList.contains('focus')){try{await stage.requestFullscreen?.()}catch{}}else if(document.fullscreenElement){await document.exitFullscreen?.()}};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)stage.classList.remove('focus')});
const camGoal=new THREE.Vector3(),targetGoal=new THREE.Vector3();function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();asset.resize(w,h,renderer.getPixelRatio())}new ResizeObserver(resize).observe(host);resize();setStep(0);
function frame(now){requestAnimationFrame(frame);if(playing)offset=(now-start)/1000;last=asset.update(offset);renderHud();camGoal.fromArray(CAM[step]);targetGoal.fromArray(TGT[step]);if(cameraSettling&&!matchMedia('(prefers-reduced-motion: reduce)').matches){camera.position.lerp(camGoal,.025);controls.target.lerp(targetGoal,.035);if(camera.position.distanceTo(camGoal)<.03&&controls.target.distanceTo(targetGoal)<.03)cameraSettling=false}controls.update();renderer.render(scene,camera)}requestAnimationFrame(frame);
</script></body></html>
