<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Tank storage preview at 600 seconds"><rect width="960" height="540" fill="#f4f8fa"/><text x="60" y="72" font-family="system-ui" font-size="30" font-weight="700" fill="#10212b">Tank storage — inlet/outlet mass balance</text><path d="M340 135V410H620V135" fill="none" stroke="#536d79" stroke-width="12"/><rect x="346" y="245" width="268" height="159" fill="#9edcf2"/><line x1="346" y1="245" x2="614" y2="245" stroke="#1686b0" stroke-width="5"/><path d="M155 180h185" stroke="#1686b0" stroke-width="10"/><path d="M320 160l30 20-30 20z" fill="#1686b0"/><path d="M620 350h180" stroke="#1686b0" stroke-width="10"/><path d="M780 330l30 20-30 20z" fill="#1686b0"/><text x="150" y="150" font-family="system-ui" font-size="20" fill="#10212b">Qin = 0.08 m³/s</text><text x="650" y="390" font-family="system-ui" font-size="20" fill="#10212b">Qout = 0.05 m³/s</text><text x="480" y="112" text-anchor="middle" font-family="system-ui" font-size="24" font-weight="700" fill="#10212b">A·dh/dt = Qin − Qout</text><text x="480" y="455" text-anchor="middle" font-family="system-ui" font-size="21" fill="#10212b">t = 600 s · h = 3.5 m · V = 42 m³</text></svg>
