<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tank storage asset demo</title><style>body{font:15px system-ui,sans-serif;margin:0;padding:24px;background:#eef5f8;color:#10212b}main{max-width:980px;margin:auto;display:grid;gap:16px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;background:#fff;padding:14px;border-radius:12px}label{display:grid;gap:4px}input{width:100%}</style></head><body><main><h1>Tank / reservoir storage</h1><p>Constant-area storage with constant inlet and requested outlet flows. At the storage bounds the model reports overflow or outlet shortfall rather than allowing an impossible level.</p><form class="controls" id="controls"><label>Tank area (m²)<input name="tankArea" type="number" min=".001" step="1" value="12"></label><label>Initial level (m)<input name="initialLevel" type="number" min="0" step=".1" value="2"></label><label>Maximum level (m)<input name="maxLevel" type="number" min=".001" step=".1" value="5"></label><label>Inflow (m³/s)<input name="inflow" type="number" min="0" step=".01" value=".08"></label><label>Outlet demand (m³/s)<input name="outflowDemand" type="number" min="0" step=".01" value=".05"></label><label>Time (s)<input name="time" type="range" min="0" max="1800" step="10" value="0"></label></form><div id="asset"></div><p id="status" role="status"></p></main><script type="module">import{createAsset}from'../src/asset.mjs';const asset=createAsset({container:document.querySelector('#asset'),seed:1,reducedMotion:true});const form=document.querySelector('#controls'),status=document.querySelector('#status');form.addEventListener('input',()=>{try{asset.setParameters({tankArea:+form.tankArea.value,initialLevel:+form.initialLevel.value,maxLevel:+form.maxLevel.value,inflow:+form.inflow.value,outflowDemand:+form.outflowDemand.value});asset.update(+form.time.value);status.textContent='';}catch(e){status.textContent=e.message;}});</script></body></html>
