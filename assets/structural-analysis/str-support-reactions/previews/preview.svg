<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Preview of pin, roller, and fixed support reaction components">
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="600" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#0f172a">Support reactions and restraints</text>
<g font-family="system-ui,sans-serif" fill="#0f172a" stroke="#0f172a">
<g transform="translate(90 160)"><text x="150" y="0" text-anchor="middle" font-size="26" stroke="none">Pin</text><line x1="40" y1="90" x2="260" y2="90" stroke-width="10"/><polygon points="150,90 110,170 190,170" fill="none" stroke-width="5"/><line x1="95" y1="170" x2="205" y2="170" stroke-width="4"/><line x1="150" y1="90" x2="235" y2="90" stroke-width="4"/><polygon points="235,90 218,80 218,100" fill="#0f172a"/><text x="235" y="72" font-size="22" stroke="none">Rx</text><line x1="150" y1="90" x2="150" y2="25" stroke-width="4"/><polygon points="150,25 140,42 160,42" fill="#0f172a"/><text x="175" y="34" font-size="22" stroke="none">Ry</text><text x="150" y="230" text-anchor="middle" font-size="22" stroke="none">restrains x, y</text></g>
<g transform="translate(450 160)"><text x="150" y="0" text-anchor="middle" font-size="26" stroke="none">Roller</text><line x1="40" y1="90" x2="260" y2="90" stroke-width="10"/><polygon points="150,90 110,160 190,160" fill="none" stroke-width="5"/><circle cx="125" cy="178" r="10" fill="none" stroke-width="4"/><circle cx="150" cy="178" r="10" fill="none" stroke-width="4"/><circle cx="175" cy="178" r="10" fill="none" stroke-width="4"/><line x1="95" y1="192" x2="205" y2="192" stroke-width="4"/><line x1="150" y1="90" x2="150" y2="25" stroke-width="4"/><polygon points="150,25 140,42 160,42" fill="#0f172a"/><text x="175" y="34" font-size="22" stroke="none">Ry</text><text x="150" y="230" text-anchor="middle" font-size="22" stroke="none">restrains y</text></g>
<g transform="translate(810 160)"><text x="150" y="0" text-anchor="middle" font-size="26" stroke="none">Fixed</text><line x1="40" y1="90" x2="150" y2="90" stroke-width="10"/><line x1="150" y1="30" x2="150" y2="190" stroke-width="14"/><line x1="150" y1="90" x2="235" y2="90" stroke-width="4"/><polygon points="235,90 218,80 218,100" fill="#0f172a"/><text x="235" y="72" font-size="22" stroke="none">Rx</text><line x1="150" y1="90" x2="150" y2="25" stroke-width="4"/><polygon points="150,25 140,42 160,42" fill="#0f172a"/><text x="175" y="34" font-size="22" stroke="none">Ry</text><path d="M215 150 A62 62 0 0 0 207 64" fill="none" stroke-width="4"/><polygon points="207,64 194,75 212,80" fill="#0f172a"/><text x="245" y="115" font-size="22" stroke="none">Mz</text><text x="150" y="230" text-anchor="middle" font-size="22" stroke="none">restrains x, y, rz</text></g>
</g>
<text x="600" y="590" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#334155">Positive arrows indicate possible reaction components — not solved force signs or magnitudes.</text>
</svg>
