<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Preview of linked beam load, shear, bending moment, and deflection diagrams">
<rect width="1200" height="675" fill="#f8fafc"/>
<g font-family="system-ui,sans-serif" fill="#0f172a" stroke="#0f172a">
<text x="600" y="55" text-anchor="middle" font-size="38" font-weight="700" stroke="none">Simply supported beam response</text>
<line x1="180" y1="145" x2="1020" y2="145" stroke-width="10"/><polygon points="180,145 150,195 210,195" fill="none" stroke-width="4"/><polygon points="1020,145 990,190 1050,190" fill="none" stroke-width="4"/><circle cx="1005" cy="205" r="9" fill="none" stroke-width="3"/><circle cx="1035" cy="205" r="9" fill="none" stroke-width="3"/>
<line x1="600" y1="82" x2="600" y2="132" stroke-width="5"/><polygon points="600,132 587,112 613,112" fill="#0f172a"/><text x="620" y="103" font-size="22" stroke="none">P = 20 kN</text><text x="600" y="225" text-anchor="middle" font-size="20" stroke="none">L = 6 m · RA = RB = 10 kN</text>
<text x="90" y="310" font-size="22" font-weight="700" stroke="none">V</text><line x1="180" y1="305" x2="1020" y2="305" stroke-width="2" stroke-dasharray="7 6"/><polyline points="180,260 600,260 600,350 1020,350" fill="none" stroke-width="4"/><text x="1020" y="250" text-anchor="end" font-size="18" stroke="none">±10 kN</text>
<text x="90" y="430" font-size="22" font-weight="700" stroke="none">M</text><line x1="180" y1="425" x2="1020" y2="425" stroke-width="2" stroke-dasharray="7 6"/><polyline points="180,425 600,365 1020,425" fill="none" stroke-width="4"/><text x="1020" y="365" text-anchor="end" font-size="18" stroke="none">Mmax = 30 kN·m</text>
<text x="90" y="555" font-size="22" font-weight="700" stroke="none">v</text><line x1="180" y1="535" x2="1020" y2="535" stroke-width="2" stroke-dasharray="7 6"/><path d="M180 535 C360 535 435 595 600 595 C765 595 840 535 1020 535" fill="none" stroke-width="4"/><text x="1020" y="600" text-anchor="end" font-size="18" stroke="none">|vmax| = 5.625 mm (exaggerated)</text>
