<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal frame lateral sway</title><style>body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f6f7f9;color:#111827}main{max-width:950px;margin:auto;padding:24px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}label{display:grid;gap:5px;font-weight:650}input,button{font:inherit;padding:8px}pre{white-space:pre-wrap}</style></head><body><main><h1>Portal frame lateral sway</h1><p>Prescribed-drift kinematic visualization; not a stiffness or design-code solver.</p><div class="controls"><label>Bay width (m)<input id="w" type="number" min="2" max="20" step=".1" value="6"></label><label>Story height (m)<input id="h" type="number" min="2" max="10" step=".1" value="3.5"></label><label>Drift ratio<input id="d" type="number" min="-.05" max=".05" step=".001" value=".015"></label><label>Display exaggeration<input id="x" type="number" min="1" max="8" step=".5" value="3"></label><button id="r" type="button">Reset</button></div><div id="asset-root"></div><pre id="out" aria-live="polite"></pre></main><script type="module">import{createAsset}from'../src/asset.mjs';const q=id=>document.getElementById(id),root=q('asset-root'),w=q('w'),h=q('h'),d=q('d'),x=q('x'),r=q('r'),out=q('out'),a=createAsset({container:root,seed:1,reducedMotion:true});function sync(){a.setParameters({bayWidthM:+w.value,storyHeightM:+h.value,driftRatio:+d.value,exaggeration:+x.value});const s=a.snapshot();out.textContent='True top displacement: '+(s.deltaXM*1000).toFixed(1)+' mm\nDrift: '+s.driftPercent.toFixed(3)+'%';}for(const input of[w,h,d,x])input.addEventListener('input',sync);r.addEventListener('click',()=>{a.reset();w.value=6;h.value=3.5;d.value=.015;x.value=3;sync();});a.resize(Math.min(880,root.clientWidth||880),420,devicePixelRatio||1);sync();</script></body></html>
