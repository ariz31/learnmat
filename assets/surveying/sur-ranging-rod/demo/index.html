<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Ranging Rod Alignment</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>
<style>:root{--ink:#18333d;--muted:#687a7d;--line:#d6deda;--teal:#087f80;--paper:#fffefa}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#e9eeea;color:var(--ink);font:14px system-ui,sans-serif}#stage,#view{position:absolute;inset:0}#view{touch-action:none}.head{position:absolute;z-index:4;left:26px;top:22px}.head small{color:var(--teal);font-weight:800;letter-spacing:.15em}.head h1{margin:7px 0;font:400 32px Georgia,serif}.panel{position:absolute;z-index:5;right:22px;top:22px;width:305px;background:#fffefae8;border:1px solid var(--line);border-radius:12px;padding:14px;backdrop-filter:blur(14px)}.panel label{display:grid;grid-template-columns:1fr auto;margin:9px 0;color:var(--muted);font-size:12px}.panel input{grid-column:1/3;width:100%}.row{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;color:var(--ink)}.btn.primary{background:var(--teal);color:#fff}.metric{position:absolute;z-index:4;left:26px;bottom:24px;background:#fffefadd;border-top:2px solid var(--ink);padding:10px 0;width:min(720px,calc(100% - 370px));backdrop-filter:blur(8px)}.metric b{font-size:17px}.metric span{color:var(--muted);margin-left:14px}.focus .head,.focus .detail{display:none}.focus .panel{top:auto;bottom:18px;width:auto}.focus .metric{left:18px;bottom:18px;width:auto;padding:10px 14px;border:1px solid var(--line);border-radius:9px}@media(max-width:760px){.head{left:14px;top:12px}.head h1{font-size:24px}.panel{left:10px;right:10px;top:auto;bottom:10px;width:auto}.metric{left:14px;right:14px;bottom:230px;width:auto}}</style></head>
<body><main id="stage"><div id="view" role="img" aria-label="Interactive 3D ranging field setup with observer, intermediate rod, distant target and line of sight"></div><header class="head"><small>SURVEYING · DIRECT RANGING</small><h1>Ranging alignment</h1></header>
<aside class="panel"><div class="detail"><label>Sight distance <output id="oD">30 m</output><input id="D" type="range" min="5" max="100" step="1" value="30"></label><label>Rod station <output id="oS">15 m</output><input id="S" type="range" min="1" max="29" step="1" value="15"></label><label>Cross-track offset <output id="oX">0.25 m</output><input id="X" type="range" min="-2" max="2" step=".01" value=".25"></label><label>Tolerance <output id="oT">0.050 m</output><input id="T" type="range" min=".005" max=".25" step=".005" value=".05"></label></div><div class="row"><button class="btn primary" id="align">Align rod</button><button class="btn" id="lineView">Line view</button><button class="btn" id="overview">Overview</button><button class="btn" id="focus">Focus</button></div></aside>
<div class="metric"><b id="status">Outside tolerance</b><span id="error">cross-track error 0.250 m</span></div>
<script type="module">
import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{createAsset}from'../src/asset.mjs';
const host=document.querySelector('#view'),stage=document.querySelector('#stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0xe9efeb);scene.fog=new THREE.Fog(0xe9efeb,45,150);
const camera=new THREE.PerspectiveCamera(40,1,.05,220);camera.position.set(12,8,14);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.02;host.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,-15);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;scene.add(new THREE.HemisphereLight(0xf2f8ff,0x5d6552,2.2));const sun=new THREE.DirectionalLight(0xffedc8,4);sun.position.set(-8,12,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);const fill=new THREE.DirectionalLight(0xb7d8e6,.48);fill.position.set(6,4,-7);scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,180),new THREE.MeshStandardMaterial({color:0x8d9579,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.z=-45;ground.receiveShadow=true;scene.add(ground);
const assetSceneChildren=new Set(scene.children);const asset=createAsset({THREE,scene,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});const assetRoots=scene.children.filter(child=>!assetSceneChildren.has(child));function fitAssetView(direction=new THREE.Vector3(1,.55,1),padding=1.35){scene.updateMatrixWorld(true);const box=new THREE.Box3();assetRoots.forEach(root=>box.expandByObject(root));if(box.isEmpty())return;const sphere=box.getBoundingSphere(new THREE.Sphere()),vFov=THREE.MathUtils.degToRad(camera.fov),hFov=2*Math.atan(Math.tan(vFov/2)*Math.max(camera.aspect,.1)),halfFov=Math.max(.12,Math.min(vFov,hFov)/2),distance=Math.max(.8,sphere.radius/Math.sin(halfFov))*padding,dir=direction.clone().normalize();controls.target.copy(sphere.center);camera.position.copy(sphere.center).addScaledVector(dir,distance);camera.near=Math.max(.02,distance/120);camera.far=Math.max(100,distance+sphere.radius*12);camera.updateProjectionMatrix();controls.minDistance=Math.max(.25,sphere.radius*.15);controls.maxDistance=Math.max(30,distance*5);controls.update()}const D=document.querySelector('#D'),S=document.querySelector('#S'),X=document.querySelector('#X'),Tol=document.querySelector('#T'),oD=document.querySelector('#oD'),oS=document.querySelector('#oS'),oX=document.querySelector('#oX'),oT=document.querySelector('#oT'),status=document.querySelector('#status'),error=document.querySelector('#error'),align=document.querySelector('#align'),lineView=document.querySelector('#lineView'),overview=document.querySelector('#overview'),focus=document.querySelector('#focus');let time=0,last=performance.now(),auto=false,startX=0,startAt=0;
function apply(){S.max=Math.max(1,+D.value-1);if(+S.value>=+D.value)S.value=+D.value-1;const q=asset.setParameters({sightDistance:+D.value,rodStationDistance:+S.value,crossTrackOffset:+X.value,alignmentTolerance:+Tol.value});oD.value=D.value+' m';oS.value=S.value+' m';oX.value=(+X.value).toFixed(2)+' m';oT.value=(+Tol.value).toFixed(3)+' m';status.textContent=q.result.aligned?'Aligned within tolerance':'Outside tolerance';error.textContent='cross-track error '+q.result.crossTrackError.toFixed(3)+' m'}
[D,S,X,Tol].forEach(x=>x.addEventListener('input',()=>{auto=false;apply()}));apply();align.onclick=()=>{auto=true;startX=+X.value;startAt=time};overview.onclick=()=>fitAssetView(new THREE.Vector3(.9,.55,.75),1.32);lineView.onclick=()=>{camera.position.set(5,2.2,2);controls.target.set(0,1,-(+D.value*.55))};focus.onclick=()=>stage.classList.toggle('focus');
function resize(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);asset.resize(w,h,renderer.getPixelRatio())}addEventListener('resize',resize);resize();fitAssetView(new THREE.Vector3(.9,.55,.75),1.32);
function frame(now){time+=Math.min((now-last)/1000,.05);last=now;if(auto){const q=Math.min(1,(time-startAt)/1.4),s=q*q*(3-2*q);X.value=(startX*(1-s)).toFixed(3);apply();if(q===1)auto=false}asset.update(time);controls.update();renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></main></body></html>
