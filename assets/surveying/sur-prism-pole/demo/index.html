<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prism Pole Carrier</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:1rem;line-height:1.45;background:Canvas;color:CanvasText}main{max-width:900px;margin:auto}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.8rem}label{display:grid;gap:.25rem}#stage{margin-top:1rem;border:1px solid color-mix(in srgb,CanvasText 25%,transparent);border-radius:.75rem;padding:.5rem}</style></head>
<body><main><h1>Prism Pole Carrier</h1><p>Target height is measured from the surveyed ground point to the prism center along the pole.</p>
<div class="controls">
<label>Target height (m)<input id="height" type="range" min="1" max="3.5" step=".05" value="2"><output id="heightOut">2.00</output></label>
<label>Pole tilt (°)<input id="tilt" type="range" min="-10" max="10" step=".1" value="0"><output id="tiltOut">0.0</output></label>
<label>Person height (m)<input id="person" type="range" min="1.4" max="2.1" step=".05" value="1.7"><output id="personOut">1.70</output></label>
</div><div id="stage"></div><p id="status" role="status"></p>
<script type="module">
import {createAsset} from '../src/asset.mjs';
const asset=createAsset({container:document.querySelector('#stage'),reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});
const height=document.querySelector('#height'),tilt=document.querySelector('#tilt'),person=document.querySelector('#person'),status=document.querySelector('#status');
function apply(){const snap=asset.setParameters({targetHeight:Number(height.value),poleTiltRad:Number(tilt.value)*Math.PI/180,personHeight:Number(person.value)});document.querySelector('#heightOut').value=Number(height.value).toFixed(2);document.querySelector('#tiltOut').value=Number(tilt.value).toFixed(1);document.querySelector('#personOut').value=Number(person.value).toFixed(2);status.textContent='Horizontal prism offset '+snap.result.horizontalOffset.toFixed(3)+' m';}
[height,tilt,person].forEach(el=>el.addEventListener('input',apply));apply();
</script></main></body></html>
