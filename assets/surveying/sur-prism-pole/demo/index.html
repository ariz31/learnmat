<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Prism Pole Carrier</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>
<style>:root{--ink:#18333d;--muted:#687a7d;--line:#d6deda;--teal:#087f80;--paper:#fffefa}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#e9eeea;color:var(--ink);font:14px system-ui,sans-serif}#stage,#view{position:absolute;inset:0}#view{touch-action:none}.head{position:absolute;z-index:4;left:26px;top:22px}.head small{color:var(--teal);font-weight:800;letter-spacing:.15em}.head h1{margin:7px 0;font:400 32px Georgia,serif}.panel{position:absolute;z-index:5;right:22px;top:22px;width:292px;background:#fffefae8;border:1px solid var(--line);border-radius:12px;padding:14px;backdrop-filter:blur(14px)}.panel label{display:grid;grid-template-columns:1fr auto;margin:9px 0;color:var(--muted);font-size:12px}.panel input{grid-column:1/3;width:100%}.row{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;color:var(--ink)}.btn.primary{background:var(--teal);color:#fff}.metric{position:absolute;z-index:4;left:26px;bottom:24px;background:#fffefadd;border-top:2px solid var(--ink);padding:10px 0;width:min(680px,calc(100% - 355px));backdrop-filter:blur(8px)}.metric b{font-size:17px}.metric span{color:var(--muted);margin-left:14px}.focus .head,.focus .detail{display:none}.focus .panel{top:auto;bottom:18px;width:auto}.focus .metric{left:18px;bottom:18px;width:auto;padding:10px 14px;border:1px solid var(--line);border-radius:9px}@media(max-width:730px){.head{left:14px;top:12px}.head h1{font-size:24px}.panel{left:10px;right:10px;top:auto;bottom:10px;width:auto}.metric{left:14px;right:14px;bottom:205px;width:auto}}</style></head>
<body><main id="stage"><div id="view" role="img" aria-label="Interactive 3D surveyor holding a prism pole and reflector target"></div><header class="head"><small>SURVEYING · TOTAL STATION TARGET</small><h1>Prism pole</h1></header>
<aside class="panel"><div class="detail"><label>Target height <output id="oh">2.00 m</output><input id="h" type="range" min="1" max="3.5" step=".05" value="2"></label><label>Pole tilt <output id="ot">0.0°</output><input id="t" type="range" min="-10" max="10" step=".1" value="0"></label><label>Person height <output id="op">1.70 m</output><input id="p" type="range" min="1.4" max="2.1" step=".05" value="1.7"></label></div><div class="row"><button class="btn primary" id="plumb">Plumb pole</button><button class="btn" id="overview">Overview</button><button class="btn" id="reset">Reset</button><button class="btn" id="focus">Focus</button></div></aside>
<div class="metric"><b id="offset">0.000 m target offset</b><span id="vertical">2.000 m vertical projection</span></div>
<script type="module">
import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{createAsset}from'../src/asset.mjs';
const host=document.querySelector('#view'),stage=document.querySelector('#stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0xe9efeb);scene.fog=new THREE.Fog(0xe9efeb,14,42);
const camera=new THREE.PerspectiveCamera(40,1,.05,90);camera.position.set(5,3.2,6.2);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.02;host.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-.15,1.35,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;scene.add(new THREE.HemisphereLight(0xf2f8ff,0x5f6654,2.15));const sun=new THREE.DirectionalLight(0xffedca,4);sun.position.set(-6,9,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);const fill=new THREE.DirectionalLight(0xb7d8e6,.48);fill.position.set(6,4,-7);scene.add(fill);
const ground=new THREE.Mesh(new THREE.CircleGeometry(13,64),new THREE.MeshStandardMaterial({color:0x8d9579,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(12,24,0x63736e,0xa2aa9d);grid.position.y=.006;scene.add(grid);
const assetSceneChildren=new Set(scene.children);const asset=createAsset({THREE,scene,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});const assetRoots=scene.children.filter(child=>!assetSceneChildren.has(child));function fitAssetView(direction=new THREE.Vector3(1,.55,1),padding=1.35){scene.updateMatrixWorld(true);const box=new THREE.Box3();assetRoots.forEach(root=>box.expandByObject(root));if(box.isEmpty())return;const sphere=box.getBoundingSphere(new THREE.Sphere()),vFov=THREE.MathUtils.degToRad(camera.fov),hFov=2*Math.atan(Math.tan(vFov/2)*Math.max(camera.aspect,.1)),halfFov=Math.max(.12,Math.min(vFov,hFov)/2),distance=Math.max(.8,sphere.radius/Math.sin(halfFov))*padding,dir=direction.clone().normalize();controls.target.copy(sphere.center);camera.position.copy(sphere.center).addScaledVector(dir,distance);camera.near=Math.max(.02,distance/120);camera.far=Math.max(100,distance+sphere.radius*12);camera.updateProjectionMatrix();controls.minDistance=Math.max(.25,sphere.radius*.15);controls.maxDistance=Math.max(30,distance*5);controls.update()}const h=document.querySelector('#h'),t=document.querySelector('#t'),P=document.querySelector('#p'),oh=document.querySelector('#oh'),ot=document.querySelector('#ot'),op=document.querySelector('#op'),offset=document.querySelector('#offset'),vertical=document.querySelector('#vertical'),plumb=document.querySelector('#plumb'),overview=document.querySelector('#overview'),reset=document.querySelector('#reset'),focus=document.querySelector('#focus');let time=0,last=performance.now(),auto=false,startTilt=0,startAt=0;
function apply(){const s=asset.setParameters({targetHeight:+h.value,poleTiltRad:+t.value*Math.PI/180,personHeight:+P.value});oh.value=(+h.value).toFixed(2)+' m';ot.value=(+t.value).toFixed(1)+'°';op.value=(+P.value).toFixed(2)+' m';offset.textContent=s.result.horizontalOffset.toFixed(3)+' m target offset';vertical.textContent=s.result.verticalProjection.toFixed(3)+' m vertical projection'}
[h,t,P].forEach(x=>x.addEventListener('input',()=>{auto=false;apply()}));apply();plumb.onclick=()=>{auto=true;startTilt=+t.value;startAt=time};overview.onclick=()=>fitAssetView(new THREE.Vector3(1,.55,1.15),1.42);reset.onclick=()=>{h.value=2;t.value=0;P.value=1.7;auto=false;apply()};focus.onclick=()=>stage.classList.toggle('focus');
function resize(){const w=host.clientWidth,hg=host.clientHeight;camera.aspect=w/hg;camera.updateProjectionMatrix();renderer.setSize(w,hg,false);asset.resize(w,hg,renderer.getPixelRatio())}addEventListener('resize',resize);resize();fitAssetView(new THREE.Vector3(1,.55,1.15),1.42);
function frame(now){time+=Math.min((now-last)/1000,.05);last=now;if(auto){const q=Math.min(1,(time-startAt)/1.2),s=q*q*(3-2*q);t.value=(startTilt*(1-s)).toFixed(3);apply();if(q===1)auto=false}asset.update(time);controls.update();renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></main></body></html>
