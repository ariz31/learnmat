<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Surveying Tape Team</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>
<style>:root{--ink:#18333d;--muted:#687a7d;--line:#d6deda;--teal:#087f80;--paper:#fffefa}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#e9eeea;color:var(--ink);font:14px system-ui,sans-serif}#stage,#view{position:absolute;inset:0}#view{touch-action:none}.head{position:absolute;z-index:4;left:26px;top:22px}.head small{color:var(--teal);font-weight:800;letter-spacing:.15em}.head h1{margin:7px 0;font:400 32px Georgia,serif}.panel{position:absolute;z-index:5;right:22px;top:22px;width:300px;background:#fffefae8;border:1px solid var(--line);border-radius:12px;padding:14px;backdrop-filter:blur(14px)}.panel label{display:grid;grid-template-columns:1fr auto;margin:9px 0;color:var(--muted);font-size:12px}.panel input[type=range]{grid-column:1/3;width:100%}.row{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;color:var(--ink)}.btn.primary{background:var(--teal);color:#fff}.metric{position:absolute;z-index:4;left:26px;bottom:24px;background:#fffefadd;border-top:2px solid var(--ink);padding:10px 0;width:min(720px,calc(100% - 360px));backdrop-filter:blur(8px)}.metric b{font-size:17px}.metric span{color:var(--muted);margin-left:14px}.focus .head,.focus .detail{display:none}.focus .panel{top:auto;bottom:18px;width:auto}.focus .metric{left:18px;bottom:18px;width:auto;padding:10px 14px;border:1px solid var(--line);border-radius:9px}@media(max-width:760px){.head{left:14px;top:12px}.head h1{font-size:24px}.panel{left:10px;right:10px;top:auto;bottom:10px;width:auto}.metric{left:14px;right:14px;bottom:210px;width:auto}}</style></head>
<body><main id="stage"><div id="view" role="img" aria-label="Interactive 3D field crew holding a surveying tape with physical catenary sag"></div><header class="head"><small>SURVEYING · TAPING FIELDWORK</small><h1>Tape team</h1></header>
<aside class="panel"><div class="detail"><label>Horizontal span <output id="oL">20 m</output><input id="L" type="range" min="2" max="50" step="1" value="20"></label><label>Mass / length <output id="om">0.020 kg/m</output><input id="m" type="range" min=".005" max=".1" step=".005" value=".02"></label><label>Horizontal tension <output id="oH">60 N</output><input id="H" type="range" min="20" max="300" step="5" value="60"></label><label><span>Sagging catenary</span><input id="sag" type="checkbox" checked></label></div><div class="row"><button class="btn primary" id="low">Show lower tension</button><button class="btn" id="overview">Overview</button><button class="btn" id="focus">Focus</button></div></aside>
<div class="metric"><b id="msag">Sag 0.000 m</b><span id="len">curve length 20.000 m</span></div>
<script type="module">
import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{createAsset}from'../src/asset.mjs';
const host=document.querySelector('#view'),stage=document.querySelector('#stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0xe9efeb);scene.fog=new THREE.Fog(0xe9efeb,30,95);
const camera=new THREE.PerspectiveCamera(38,1,.05,160);camera.position.set(11,6,12);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;host.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(10,1,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;
scene.add(new THREE.HemisphereLight(0xf0f7ff,0x5d6551,2.2));const sun=new THREE.DirectionalLight(0xffedc9,3.9);sun.position.set(-8,12,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(130,45),new THREE.MeshStandardMaterial({color:0x8e967a,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const asset=createAsset({THREE,scene,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});
const L=document.querySelector('#L'),M=document.querySelector('#m'),H=document.querySelector('#H'),S=document.querySelector('#sag');function apply(){const q=asset.setParameters({horizontalSpan:+L.value,massPerLength:+M.value,horizontalTension:+H.value,sagEnabled:S.checked});oL.value=L.value+' m';om.value=(+M.value).toFixed(3)+' kg/m';oH.value=H.value+' N';msag.textContent='Sag '+q.result.sag.toFixed(4)+' m';len.textContent='curve length '+q.result.curveLength.toFixed(4)+' m · excess '+q.result.lengthExcess.toFixed(4)+' m';controls.target.set(+L.value/2,1,0)}
[L,M,H,S].forEach(x=>x.addEventListener('input',apply));apply();low.onclick=()=>{H.value=30;S.checked=true;apply()};overview.onclick=()=>{camera.position.set(+L.value*.55,Math.max(5,+L.value*.22),Math.max(10,+L.value*.5));controls.target.set(+L.value/2,1,0)};focus.onclick=()=>stage.classList.toggle('focus');
let last=performance.now(),time=0;function resize(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);asset.resize(w,h,renderer.getPixelRatio())}addEventListener('resize',resize);resize();function frame(now){time+=Math.min((now-last)/1000,.05);last=now;asset.update(time);controls.update();renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></main></body></html>
