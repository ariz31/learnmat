<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surveying Tape Team</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:1rem;line-height:1.45;background:Canvas;color:CanvasText}main{max-width:940px;margin:auto}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.8rem}label{display:grid;gap:.25rem}#stage{margin-top:1rem;border:1px solid color-mix(in srgb,CanvasText 25%,transparent);border-radius:.75rem;padding:.5rem}</style></head>
<body><main><h1>Surveying Tape Team</h1><p>Compare a straight endpoint reference with a tape sagging under self-weight. The catenary uses the horizontal component of tension.</p>
<div class="controls">
<label>Horizontal span (m)<input id="span" type="range" min="2" max="50" step="1" value="20"><output id="spanOut">20</output></label>
<label>Mass per length (kg/m)<input id="mass" type="range" min=".005" max=".1" step=".005" value=".02"><output id="massOut">0.020</output></label>
<label>Horizontal tension (N)<input id="tension" type="range" min="20" max="300" step="5" value="60"><output id="tensionOut">60</output></label>
<label><input id="sag" type="checkbox" checked> Show sagging tape</label>
</div><div id="stage"></div><p id="status" role="status"></p>
<script type="module">
import {createAsset} from '../src/asset.mjs';
const asset=createAsset({container:document.querySelector('#stage')});
const span=document.querySelector('#span'),mass=document.querySelector('#mass'),tension=document.querySelector('#tension'),sag=document.querySelector('#sag'),status=document.querySelector('#status');
function apply(){const snap=asset.setParameters({horizontalSpan:Number(span.value),massPerLength:Number(mass.value),horizontalTension:Number(tension.value),sagEnabled:sag.checked});document.querySelector('#spanOut').value=span.value;document.querySelector('#massOut').value=Number(mass.value).toFixed(3);document.querySelector('#tensionOut').value=tension.value;status.textContent='Sag '+snap.result.sag.toFixed(4)+' m; curve length '+snap.result.curveLength.toFixed(4)+' m';}
[span,mass,tension,sag].forEach(el=>el.addEventListener('input',apply));apply();
</script></main></body></html>
