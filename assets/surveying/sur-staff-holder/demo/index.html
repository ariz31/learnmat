<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Leveling Staff Holder</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>
<style>:root{--ink:#19333c;--muted:#64777c;--line:#d8dfda;--teal:#087f80;--paper:#fffefa}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#edf1ec;color:var(--ink);font:14px system-ui,sans-serif}#stage,#view{position:absolute;inset:0}#view{touch-action:none}.title{position:absolute;z-index:4;left:26px;top:22px}.title small{color:var(--teal);font-weight:800;letter-spacing:.15em}.title h1{margin:7px 0;font:400 32px Georgia,serif}.card{position:absolute;z-index:5;right:22px;top:22px;width:292px;background:#fffefae8;border:1px solid var(--line);border-radius:12px;padding:14px;backdrop-filter:blur(14px);box-shadow:0 18px 70px #17333d1b}.card label{display:grid;grid-template-columns:1fr auto;margin:10px 0;color:var(--muted);font-size:12px}.card input{grid-column:1/3;width:100%}.row{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;color:var(--ink)}.btn.primary{background:var(--teal);color:white}.metric{position:absolute;z-index:4;left:26px;bottom:24px;background:#fffefadd;border-top:2px solid var(--ink);padding:10px 0;width:min(650px,calc(100% - 360px));backdrop-filter:blur(8px)}.metric b{font-size:17px}.metric span{color:var(--muted);margin-left:14px}.focus .title,.focus .detail{display:none}.focus .card{top:auto;bottom:18px;width:auto}.focus .metric{left:18px;bottom:18px;width:auto;padding:10px 14px;border:1px solid var(--line);border-radius:9px}@media(max-width:720px){.title{left:14px;top:12px}.title h1{font-size:24px}.card{left:10px;right:10px;top:auto;bottom:10px;width:auto}.metric{left:14px;right:14px;bottom:205px;width:auto}}</style></head>
<body><main id="stage"><div id="view" role="img" aria-label="Interactive 3D surveyor holding a graduated leveling staff"></div><header class="title"><small>SURVEYING · DIFFERENTIAL LEVELING</small><h1>Staff holder</h1></header>
<aside class="card"><div class="detail"><label>Staff height <output id="oh">3.00 m</output><input id="h" type="range" min="2" max="5" step=".05" value="3"></label><label>Tilt <output id="ot">0.0°</output><input id="t" type="range" min="-5" max="5" step=".1" value="0"></label><label>Reading <output id="or">1.50 m</output><input id="r" type="range" min="0" max="3" step=".05" value="1.5"></label></div><div class="row"><button class="btn primary" id="plumb">Plumb staff</button><button class="btn" id="overview">Overview</button><button class="btn" id="reset">Reset</button><button class="btn" id="focus">Focus</button></div></aside>
<div class="metric"><b id="offset">0.000 m offset</b><span id="projection">3.000 m vertical projection</span></div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{createAsset}from'../src/asset.mjs';
const host=document.querySelector('#view'),stage=document.querySelector('#stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0xe9eee9);scene.fog=new THREE.Fog(0xe9eee9,12,36);
const camera=new THREE.PerspectiveCamera(40,1,.05,80);camera.position.set(5.2,3.2,6.2);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;host.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-.1,1.45,0);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xf1f7ff,0x5e6354,2.1));const sun=new THREE.DirectionalLight(0xffedca,4);sun.position.set(-5,9,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(12,64),new THREE.MeshStandardMaterial({color:0x8e9477,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(12,24,0x60736e,0x9ca397);grid.position.y=.006;scene.add(grid);
const assetSceneChildren=new Set(scene.children);const asset=createAsset({THREE,scene,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});const assetRoots=scene.children.filter(child=>!assetSceneChildren.has(child));function fitAssetView(direction=new THREE.Vector3(1,.55,1),padding=1.35){scene.updateMatrixWorld(true);const box=new THREE.Box3();assetRoots.forEach(root=>box.expandByObject(root));if(box.isEmpty())return;const sphere=box.getBoundingSphere(new THREE.Sphere()),vFov=THREE.MathUtils.degToRad(camera.fov),hFov=2*Math.atan(Math.tan(vFov/2)*Math.max(camera.aspect,.1)),halfFov=Math.max(.12,Math.min(vFov,hFov)/2),distance=Math.max(.8,sphere.radius/Math.sin(halfFov))*padding,dir=direction.clone().normalize();controls.target.copy(sphere.center);camera.position.copy(sphere.center).addScaledVector(dir,distance);camera.near=Math.max(.02,distance/120);camera.far=Math.max(100,distance+sphere.radius*12);camera.updateProjectionMatrix();controls.minDistance=Math.max(.25,sphere.radius*.15);controls.maxDistance=Math.max(30,distance*5);controls.update()}
const h=document.querySelector('#h'),t=document.querySelector('#t'),r=document.querySelector('#r'),oh=document.querySelector('#oh'),ot=document.querySelector('#ot'),or=document.querySelector('#or'),offset=document.querySelector('#offset'),projection=document.querySelector('#projection'),plumb=document.querySelector('#plumb'),overview=document.querySelector('#overview'),reset=document.querySelector('#reset'),focus=document.querySelector('#focus');let elapsed=0,last=performance.now(),plumbing=false,startTilt=0,startTime=0;
function apply(){r.max=h.value;if(+r.value>+h.value)r.value=h.value;const s=asset.setParameters({staffHeight:+h.value,staffTiltRad:+t.value*Math.PI/180,readingHeight:+r.value});oh.value=(+h.value).toFixed(2)+' m';ot.value=(+t.value).toFixed(1)+'°';or.value=(+r.value).toFixed(2)+' m';offset.textContent=s.result.topOffsetX.toFixed(3)+' m offset';projection.textContent=s.result.topVerticalProjection.toFixed(3)+' m vertical projection';}
[h,t,r].forEach(x=>x.addEventListener('input',()=>{plumbing=false;apply()}));apply();plumb.onclick=()=>{plumbing=true;startTilt=+t.value;startTime=elapsed};overview.onclick=()=>fitAssetView(new THREE.Vector3(1,.5,1.15),1.45);reset.onclick=()=>{h.value=3;t.value=0;r.value=1.5;plumbing=false;apply()};focus.onclick=()=>stage.classList.toggle('focus');
function resize(){const w=host.clientWidth,hg=host.clientHeight;camera.aspect=w/hg;camera.updateProjectionMatrix();renderer.setSize(w,hg,false);asset.resize(w,hg,renderer.getPixelRatio())}addEventListener('resize',resize);resize();fitAssetView(new THREE.Vector3(1,.5,1.15),1.45);
function frame(now){elapsed+=Math.min((now-last)/1000,.05);last=now;if(plumbing){const q=Math.min(1,(elapsed-startTime)/1.2);t.value=(startTilt*(1-(q*q*(3-2*q)))).toFixed(3);apply();if(q===1)plumbing=false}asset.update(elapsed);controls.update();renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></main></body></html>
