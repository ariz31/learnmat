<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surveying Walking Person · 3D</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>
<style>
:root{--ink:#18333d;--muted:#6b7c80;--line:#d6ded9;--paper:#fffefa;--teal:#087f80}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#eef1ec;color:var(--ink);font:14px Inter,system-ui,sans-serif}.stage{position:relative;width:100%;height:100%}#view{position:absolute;inset:0;touch-action:none}.head{position:absolute;z-index:4;left:28px;top:24px;pointer-events:none}.head small{letter-spacing:.16em;color:var(--teal);font-weight:800}.head h1{margin:7px 0 0;font:400 34px Georgia,serif}.panel{position:absolute;z-index:5;right:24px;top:24px;width:280px;background:#fffefae8;border:1px solid var(--line);border-radius:12px;padding:14px;backdrop-filter:blur(14px);box-shadow:0 18px 70px #17333d1b}.panel label{display:grid;grid-template-columns:1fr auto;gap:6px;margin:10px 0;color:var(--muted);font-size:12px}.panel input{grid-column:1/3;width:100%}.row{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 10px}.btn.primary{background:var(--teal);color:white;border-color:var(--teal)}.metrics{position:absolute;z-index:4;left:28px;bottom:26px;background:#fffefae0;border-top:2px solid var(--ink);padding:10px 0;width:min(620px,calc(100% - 360px));backdrop-filter:blur(8px)}.metrics b{font-size:18px}.metrics span{color:var(--muted);margin-left:14px}.focus .head,.focus .panel .detail{display:none}.focus .panel{top:auto;bottom:18px;right:18px;width:auto}.focus .metrics{left:18px;bottom:18px;width:auto;padding:10px 14px;border:1px solid var(--line);border-radius:9px}@media(max-width:720px){.head{left:16px;top:14px}.head h1{font-size:25px}.panel{left:12px;right:12px;top:auto;bottom:12px;width:auto}.metrics{left:16px;right:16px;bottom:190px;width:auto}.detail{display:none}}
</style></head><body><main class="stage" id="stage"><div id="view" role="img" aria-label="Interactive 3D surveying worker walking along a measured field path"></div>
<header class="head"><small>SURVEYING · 3D FIELD PRIMITIVE</small><h1>Walking person</h1></header>
<aside class="panel"><div class="detail"><label>Path length <output id="oL">10.0 m</output><input id="L" type="range" min=".5" max="50" step=".5" value="10"></label><label>Speed <output id="oV">1.2 m/s</output><input id="V" type="range" min="0" max="2.5" step=".1" value="1.2"></label><label>Gait <output id="oF">1.7 Hz</output><input id="F" type="range" min=".5" max="3" step=".1" value="1.7"></label></div><div class="row"><button class="btn primary" id="play">Pause</button><button class="btn" id="overview">Overview</button><button class="btn" id="reset">Reset</button><button class="btn" id="focus">Focus</button></div></aside>
<div class="metrics"><b id="distance">0.00 m</b><span id="note">speed × time, clamped at endpoint</span></div>
<script type="module">import {fitSceneToView, getFitPose} from '../../../../shared/fit-camera.mjs';
import * as THREE from 'three'; import {OrbitControls} from 'three/addons/controls/OrbitControls.js'; import {createAsset} from '../src/asset.mjs';
const host=document.querySelector('#view'),stage=document.querySelector('#stage');
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe9eee9);scene.fog=new THREE.Fog(0xe9eee9,18,55);
const camera=new THREE.PerspectiveCamera(42,1,.05,120);camera.position.set(7,4.4,8.5);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;host.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(4.3,.85,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;
scene.add(new THREE.HemisphereLight(0xeaf4ff,0x6b675a,2.2));const sun=new THREE.DirectionalLight(0xfff2d5,3.8);sun.position.set(-6,10,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,36),new THREE.MeshStandardMaterial({color:0x8b9477,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(40,40,0x6a7669,0x9da695);grid.position.y=.008;scene.add(grid);
const assetSceneChildren=new Set(scene.children);const asset=createAsset({THREE,scene,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});const assetRoots=scene.children.filter(child=>!assetSceneChildren.has(child));function fitAssetView(direction=new THREE.Vector3(1,.55,1),padding=1.35){fitSceneToView({THREE,scene,camera,controls,roots:assetRoots,direction,padding})}
let playing=true,elapsed=0,last=performance.now();
const L=document.querySelector('#L'),V=document.querySelector('#V'),F=document.querySelector('#F'),oL=document.querySelector('#oL'),oV=document.querySelector('#oV'),oF=document.querySelector('#oF'),distance=document.querySelector('#distance'),play=document.querySelector('#play'),overview=document.querySelector('#overview'),reset=document.querySelector('#reset'),focus=document.querySelector('#focus');
function apply(){asset.setParameters({pathLength:+L.value,speed:+V.value,stepFrequency:+F.value});oL.value=(+L.value).toFixed(1)+' m';oV.value=(+V.value).toFixed(1)+' m/s';oF.value=(+F.value).toFixed(1)+' Hz';}
[L,V,F].forEach(x=>x.addEventListener('input',apply));apply();
play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play';last=performance.now()};overview.onclick=()=>fitAssetView(new THREE.Vector3(.8,.45,1),1.38);reset.onclick=()=>{elapsed=0;asset.update(0)};focus.onclick=()=>stage.classList.toggle('focus');
function resize(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);asset.resize(w,h,renderer.getPixelRatio())}addEventListener('resize',resize);resize();fitAssetView(new THREE.Vector3(.8,.45,1),1.38);
function frame(now){const dt=(now-last)/1000;last=now;if(playing)elapsed+=Math.min(dt,.05);const s=asset.update(elapsed);distance.textContent=s.result.distanceTravelled.toFixed(2)+' m';controls.update();renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></main></body></html>
