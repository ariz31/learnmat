<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Surveying Tripod and Level</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>
<style>:root{--ink:#18333d;--muted:#64777c;--line:#d8dfda;--teal:#087f80;--paper:#fffefa}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#e9eeea;color:var(--ink);font:14px system-ui,sans-serif}#stage,#view{position:absolute;inset:0}#view{touch-action:none}.head{position:absolute;z-index:4;left:28px;top:24px}.head small{letter-spacing:.16em;color:var(--teal);font-weight:800}.head h1{margin:7px 0;font:400 34px Georgia,serif}.panel{position:absolute;z-index:5;right:24px;top:24px;width:305px;background:#fffefae8;border:1px solid var(--line);border-radius:12px;padding:14px;backdrop-filter:blur(14px);box-shadow:0 18px 70px #17333d1b}.panel label{display:grid;grid-template-columns:1fr auto;margin:9px 0;color:var(--muted);font-size:12px}.panel input{grid-column:1/3;width:100%}.row{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;color:var(--ink)}.btn.primary{background:var(--teal);color:white}.metrics{position:absolute;z-index:4;left:28px;bottom:25px;background:#fffefadd;border-top:2px solid var(--ink);padding:10px 0;width:min(680px,calc(100% - 375px));backdrop-filter:blur(8px)}.metrics b{font-size:16px}.metrics span{color:var(--muted);margin-left:12px}.focus .head,.focus .detail{display:none}.focus .panel{top:auto;bottom:18px;width:auto}.focus .metrics{left:18px;bottom:18px;width:auto;padding:10px 14px;border:1px solid var(--line);border-radius:9px}@media(max-width:760px){.head{left:14px;top:12px}.head h1{font-size:25px}.panel{left:10px;right:10px;top:auto;bottom:10px;width:auto}.metrics{left:14px;right:14px;bottom:225px;width:auto}}</style></head>
<body><main id="stage"><div id="view" role="img" aria-label="Interactive 3D automatic level on tripod with sight axis"></div><header class="head"><small>SURVEYING · LEVEL INSTRUMENT</small><h1>Tripod + level</h1></header>
<aside class="panel"><div class="detail"><label>Instrument height <output id="oh">1.50 m</output><input id="h" type="range" min="1" max="2.2" step=".05" value="1.5"></label><label>Leg spread <output id="os">0.80 m</output><input id="s" type="range" min=".4" max="1.2" step=".05" value=".8"></label><label>Azimuth <output id="oa">0°</output><input id="a" type="range" min="-180" max="180" step="1" value="0"></label><label>Sight elevation <output id="oe">0.0°</output><input id="e" type="range" min="-5" max="5" step=".1" value="0"></label></div><div class="row"><button class="btn primary" id="level">Level sight</button><button class="btn" id="overview">Overview</button><button class="btn" id="top">Top</button><button class="btn" id="focus">Focus</button></div></aside>
<div class="metrics"><b id="axis">Axis: (0.000, 0.000, -1.000)</b><span id="note">azimuth clockwise from north</span></div>
<script type="module">import {fitSceneToView, getFitPose} from '../../../../shared/fit-camera.mjs';
import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{createAsset}from'../src/asset.mjs';
const host=document.querySelector('#view'),stage=document.querySelector('#stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0xe8eeec);scene.fog=new THREE.Fog(0xe8eeec,13,45);
const camera=new THREE.PerspectiveCamera(40,1,.04,100);camera.position.set(4.8,3.2,5.5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;host.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.05,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;
scene.add(new THREE.HemisphereLight(0xf0f7ff,0x5f6656,2.1));const sun=new THREE.DirectionalLight(0xffedc8,4.1);sun.position.set(-6,9,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(15,64),new THREE.MeshStandardMaterial({color:0x8e9479,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(14,28,0x5e716b,0x9fa69a);grid.position.y=.006;scene.add(grid);
const assetSceneChildren=new Set(scene.children);const asset=createAsset({THREE,scene});const assetRoots=scene.children.filter(child=>!assetSceneChildren.has(child));function fitAssetView(direction=new THREE.Vector3(1,.55,1),padding=1.35){fitSceneToView({THREE,scene,camera,controls,roots:assetRoots,direction,padding})}const h=document.querySelector('#h'),s=document.querySelector('#s'),a=document.querySelector('#a'),e=document.querySelector('#e'),oh=document.querySelector('#oh'),os=document.querySelector('#os'),oa=document.querySelector('#oa'),oe=document.querySelector('#oe'),axis=document.querySelector('#axis'),level=document.querySelector('#level'),overview=document.querySelector('#overview'),top=document.querySelector('#top'),focus=document.querySelector('#focus');
function apply(){const snap=asset.setParameters({instrumentHeight:+h.value,legSpread:+s.value,sightAzimuthRad:+a.value*Math.PI/180,sightElevationRad:+e.value*Math.PI/180});oh.value=(+h.value).toFixed(2)+' m';os.value=(+s.value).toFixed(2)+' m';oa.value=(+a.value).toFixed(0)+'°';oe.value=(+e.value).toFixed(1)+'°';const d=snap.result.sightDirection;axis.textContent='Axis: ('+d.x.toFixed(3)+', '+d.y.toFixed(3)+', '+d.z.toFixed(3)+')';}
[h,s,a,e].forEach(x=>x.addEventListener('input',apply));apply();level.onclick=()=>{e.value=0;apply()};overview.onclick=()=>fitAssetView(new THREE.Vector3(1,.62,1.05),1.38);top.onclick=()=>{camera.position.set(.01,7,.01);controls.target.set(0,0,0)};focus.onclick=()=>stage.classList.toggle('focus');
function resize(){const w=host.clientWidth,hg=host.clientHeight;camera.aspect=w/hg;camera.updateProjectionMatrix();renderer.setSize(w,hg,false);asset.resize(w,hg,renderer.getPixelRatio())}addEventListener('resize',resize);resize();fitAssetView(new THREE.Vector3(1,.62,1.05),1.38);
function frame(t){asset.update(t/1000);controls.update();renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></main></body></html>
