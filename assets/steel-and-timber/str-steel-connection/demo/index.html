<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steel shear connection</title><style>body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f6f7f9;color:#111827}main{max-width:1000px;margin:auto;padding:24px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}label{display:grid;gap:4px;font-weight:650}input,button{font:inherit;padding:7px}pre{white-space:pre-wrap}</style></head><body><main><h1>Exploded bolted steel shear connection</h1><p>Assembly geometry only; no strength or code-compliance calculation.</p><div class="controls"><label>Plate width (m)<input id="pw" type="number" value=".14" step=".01"></label><label>Plate height (m)<input id="ph" type="number" value=".34" step=".01"></label><label>Plate thickness (m)<input id="pt" type="number" value=".012" step=".001"></label><label>Bolt dia (m)<input id="bd" type="number" value=".02" step=".001"></label><label>Bolt count<input id="bc" type="number" value="4" step="1"></label><label>Bolt spacing (m)<input id="bs" type="number" value=".075" step=".005"></label><label>Minimum edge (m)<input id="ed" type="number" value=".045" step=".005"></label><label>Explode (m)<input id="ex" type="number" value=".08" step=".01"></label><button id="r" type="button">Reset</button></div><div id="asset-root"></div><pre id="out" aria-live="polite"></pre></main><script type="module">import{createAsset}from'../src/asset.mjs';const root=document.querySelector('#asset-root'),a=createAsset({container:root,seed:1,reducedMotion:true});function sync(){try{a.setParameters({plateWidthM:+pw.value,plateHeightM:+ph.value,plateThicknessM:+pt.value,boltDiameterM:+bd.value,boltCount:+bc.value,boltSpacingM:+bs.value,minimumEdgeDistanceM:+ed.value,explodeM:+ex.value});const s=a.snapshot();out.textContent='Vertical edge distance: '+(s.actualVerticalEdgeDistanceM*1000).toFixed(1)+' mm\nHorizontal edge distance: '+(s.actualHorizontalEdgeDistanceM*1000).toFixed(1)+' mm\nGeometry checks: '+JSON.stringify(s.checks);}catch(err){out.textContent=err.message;}}for(const x of[pw,ph,pt,bd,bc,bs,ed,ex])x.addEventListener('input',sync);r.addEventListener('click',()=>location.reload());a.resize(Math.min(930,root.clientWidth||930),480,devicePixelRatio||1);sync();</script></body></html>
